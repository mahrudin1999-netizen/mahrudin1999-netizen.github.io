
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube - GIRINATAN</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#080808;color:white;
  font-family:Arial,sans-serif;padding-bottom:80px;
}

header{
  padding:17px 16px;
  background:#080808;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  font-size:22px;
  font-weight:800;
  letter-spacing:.5px;
}

.brand span{
  color:#D6AD48;
}

.brand{font-size:20px;font-weight:bold}
.brand span{color:#D6AD48}
main{max-width:760px;margin:auto;padding:15px}
h2{color:#D6AD48;margin-top:10px}

.search{
  display:flex;
  gap:9px;
  margin:17px 0;
}

input{
  min-width:0;
  flex:1;
  padding:14px 16px;
  border-radius:25px;
  border:1px solid #343434;
  background:#151515;
  color:white;
  font-size:14px;
  outline:none;
}

input:focus{
  border-color:#D6AD48;
}

.search button{
  border-radius:25px;
  padding:0 20px;
  background:linear-gradient(135deg,#E5C36A,#B88A2E);
  color:#080808;
}

button{
  border:0;border-radius:9px;padding:12px;
  background:#D6AD48;color:#080808;font-weight:bold;
}

.tabs{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin:18px 0 22px;
  padding-bottom:5px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tabs button{
  white-space:nowrap;
  padding:10px 17px;
  border-radius:9px;
  background:#202020;
  color:#ddd;
  border:1px solid #343434;
  font-size:13px;
  transition:.2s;
}

.tabs button.active{
  background:#D6AD48;
  color:#080808;
  border-color:#D6AD48;
  font-weight:bold;
}

#message{color:#A8ADA8;font-size:13px}

.video{
  margin-bottom:25px;
  cursor:pointer;
  overflow:hidden;
  transition:transform .2s ease;
}

.video:active{
  transform:scale(.98);
}

.thumb{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:15px;
  background:#202020;
  border:1px solid #292929;
  display:block;
}

.video h3{
  font-size:15px;
  line-height:1.5;
  margin:11px 0 5px;
  color:#fff;
  font-weight:600;
}

.video small{
  color:#A8ADA8;
  font-size:12px;
}


#playerBox{
  display:none;
  margin:18px 0 25px;
  padding:10px;
  background:#151515;
  border:1px solid #343434;
  border-radius:16px;
  box-shadow:0 8px 25px rgba(0,0,0,.35);
}

#player{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  border-radius:11px;
  background:#000;
  display:block;
}

#playingTitle{
  color:#D6AD48;
  font-size:15px;
  line-height:1.5;
  margin:12px 3px 5px;
  font-weight:bold;
}

nav{
  position:fixed;bottom:0;left:0;width:100%;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:#111;border-top:1px solid #806326;
  padding:11px 4px;text-align:center;
}
nav a{
  color:#A8ADA8;text-decoration:none;font-size:11px;
}
nav a span{display:block;font-size:19px;margin-bottom:4px}
</style>
</head>

<body>

<header>
  <div class="brand">GIRI<span>NATAN</span></div>
  <strong style="color:#D6AD48">▶ YouTube</strong>
</header>

<main>
  <div class="search">
    <input id="searchInput" placeholder="Cari video YouTube...">
    <button onclick="cariVideo()">Cari</button>
  </div>
<button id="homeButton" onclick="kembaliBeranda()">
  🏠 Beranda Video
</button>
  <div class="tabs">
    <button class="active" onclick="beranda(this)">Untuk Anda</button>
    <button onclick="kategori('musik',this)">Musik</button>
    <button onclick="kategori('hiburan',this)">Hiburan</button>
    <button onclick="kategori('olahraga',this)">Olahraga</button>
    <button onclick="kategori('berita',this)">Berita</button>
  </div>

  <div id="playerBox">
    <iframe id="player" allowfullscreen
      allow="accelerometer; autoplay; encrypted-media; picture-in-picture">
    </iframe>
    <h3 id="playingTitle"></h3>
  </div>

  <p id="message">Memuat video...</p>
  <div id="videoList"></div>
</main>

<nav>
  <a href="../index.html"><span>⌂</span>Beranda</a>
  <a href="../index.html#marketPage"><span>▣</span>Market</a>
  <a href="../index.html#karyaPage"><span>✦</span>Berkarya</a>
  <a href="../komunitas/index.html"><span>♧</span>Komunitas</a>
  <a href="../index.html#accountPage"><span>♙</span>Akun</a>
</nav>

<script>
const WORKER_URL = "https://girinatanyoutube.mahrudin1999.workers.dev";

const list = document.getElementById("videoList");
const message = document.getElementById("message");

function tampilkanPesan(teks) {
  message.textContent = teks;
}

function tampilkanVideo(videos) {
  list.innerHTML = "";

  if (!videos || videos.length === 0) {
    tampilkanPesan("Video tidak ditemukan.");
    return;
  }

  tampilkanPesan("");

  videos.forEach(video => {
    const id = typeof video.id === "object"
      ? video.id.videoId
      : video.id;

    const data = video.snippet;
    if (!id || !data) return;

    const card = document.createElement("div");
    card.className = "video";

    const img = document.createElement("img");
    img.className = "thumb";
    img.src = data.thumbnails.medium.url;
    img.alt = data.title;

    const title = document.createElement("h3");
    title.textContent = data.title;

    const channel = document.createElement("small");
    channel.textContent = data.channelTitle;

    card.append(img, title, channel);
    card.onclick = () => putarVideo(id, data.title);

    list.appendChild(card);
  });

  if (!list.children.length) {
    tampilkanPesan("Video tidak ditemukan.");
  }
}

function putarVideo(id, title) {
  document.getElementById("playerBox").style.display = "block";
  document.getElementById("player").src =
    "https://www.youtube-nocookie.com/embed/" +
    encodeURIComponent(id);

  document.getElementById("playingTitle").textContent = title;

  document.getElementById("playerBox").scrollIntoView({
    behavior: "smooth"
  });
}

async function ambilVideo(action, kata = "") {
  try {
    tampilkanPesan("Memuat video...");
    list.innerHTML = "";

    const url = new URL(WORKER_URL);
    url.searchParams.set("action", action);

    if (kata) {
      url.searchParams.set("q", kata);
    }

    const response = await fetch(url.toString());
    const data = await response.json();

    if (!response.ok || data.error) {
      throw new Error(
        data.error?.message || "Gagal mengambil video."
      );
    }

    tampilkanVideo(data.items);

  } catch (error) {
  tampilkanPesan("Gagal memuat video: " + error.message);

  list.innerHTML = "";

  const retry = document.createElement("button");
  retry.textContent = "↻ Coba Lagi";
  retry.onclick = () => ambilVideo(action, kata);

  list.appendChild(retry);
}
}

function beranda(button) {
  pilihTab(button);
  ambilVideo("popular");
}
function kembaliBeranda(){
  document.getElementById("searchInput").value = "";
  beranda(document.querySelector(".tabs button"));
  }
function cariVideo() {
  const kata = document.getElementById("searchInput").value.trim();

  if (!kata) {
    tampilkanPesan("Masukkan kata pencarian.");
    return;
  }

  ambilVideo("search", kata);
}

function kategori(kata, button) {
  pilihTab(button);
  document.getElementById("searchInput").value = kata;
  cariVideo();
}

function pilihTab(button) {
  document.querySelectorAll(".tabs button").forEach(b => {
    b.classList.remove("active");
  });

  button.classList.add("active");
}

document.getElementById("searchInput")
  .addEventListener("keydown", event => {
    if (event.key === "Enter") cariVideo();
  });

beranda(document.querySelector(".tabs button"));
</script>
</body>
</html>
