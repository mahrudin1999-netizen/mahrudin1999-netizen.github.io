<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>YouTube - GIRINATAN</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#080808;
  --panel:#151515;
  --panel2:#202020;
  --gold:#D6AD48;
  --green:#00C875;
  --text:#fff;
  --muted:#A8ADA8;
  --border:#343434;
}

body{
  margin:0;
  padding:0 0 calc(76px + env(safe-area-inset-bottom));
  background:var(--bg);
  color:var(--text);
  font-family:Roboto,Arial,sans-serif;
}

button,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px;
}

[hidden]{display:none!important}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:500;
  min-height:62px;
  padding:10px 14px;
  padding-top:max(10px,env(safe-area-inset-top));
  background:#080808;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
}

.brand{
  flex:0 0 auto;
  font-size:20px;
  font-weight:900;
  letter-spacing:-.8px;
  white-space:nowrap;
}

.brand span{color:var(--gold)}

.header-search{
  flex:1;
  min-width:0;
  display:flex;
  gap:5px;
}

.header-search input{
  width:100%;
  min-width:0;
  border:1px solid var(--border);
  border-radius:24px;
  padding:10px 13px;
  background:#171717;
  color:white;
  outline:none;
}

.header-search button{
  width:40px;
  flex:0 0 40px;
  border-radius:50%;
  background:#202020;
  color:white;
  border:1px solid var(--border);
}

.header-icon{
  flex:0 0 auto;
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:white;
  font-size:20px;
  padding:0;
}

.header-icon:active{background:#292929}

/* MAIN */
main{
  width:100%;
  max-width:1250px;
  margin:auto;
  padding:10px 12px 25px;
}

.page{display:none}
.page.active{display:block}

/* CATEGORY */
.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:8px 0 14px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.categories::-webkit-scrollbar{display:none}

.categories button{
  flex:0 0 auto;
  padding:9px 15px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:#eee;
  font-size:13px;
}

.categories button.active{
  background:var(--gold);
  color:#080808;
  border-color:var(--gold);
  font-weight:bold;
}

.section-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:12px 0;
}

.section-heading h2{
  font-size:17px;
  margin:0;
  color:var(--gold);
}

.section-heading small{
  color:var(--muted);
  font-size:12px;
}

.message{
  min-height:18px;
  color:var(--muted);
  font-size:13px;
  margin:8px 0;
}

/* VIDEO GRID */
.video-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:24px 15px;
}

.video-card{
  min-width:0;
  overflow:hidden;
}

.thumbnail-wrap{
  position:relative;
  width:100%;
  cursor:pointer;
}

.thumbnail{
  width:100%;
  display:block;
  aspect-ratio:16/9;
  object-fit:cover;
  background:#222;
  border-radius:12px;
}

.play-overlay{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  pointer-events:none;
}

.play-overlay span{
  background:#000b;
  padding:9px 15px;
  border-radius:30px;
  font-size:20px;
}

.video-details{
  display:flex;
  gap:10px;
  padding-top:10px;
}

.channel-avatar{
  width:37px;
  height:37px;
  flex:0 0 37px;
  border-radius:50%;
  background:#292929;
  display:grid;
  place-items:center;
  color:var(--gold);
  font-weight:bold;
  overflow:hidden;
}

.channel-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.video-text{min-width:0;flex:1}

.video-title{
  font-size:14px;
  font-weight:700;
  line-height:1.45;
  margin:0 0 5px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.video-meta{
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.card-menu{
  border:0;
  background:transparent;
  color:white;
  font-size:20px;
  padding:0 5px;
  align-self:flex-start;
}

.card-actions{
  display:flex;
  gap:8px;
  margin:9px 0 0 47px;
}

.small-action{
  background:#202020;
  color:var(--gold);
  border:1px solid var(--border);
  border-radius:20px;
  padding:7px 11px;
  font-size:12px;
}

.small-action.saved{color:var(--green);border-color:var(--green)}

.empty-state{
  padding:35px 15px;
  text-align:center;
  background:var(--panel);
  color:var(--muted);
  border-radius:12px;
}

/* WATCH PAGE */
.watch-layout{display:block}

.watch-main{min-width:0}

.back-button{
  border:0;
  color:var(--gold);
  background:transparent;
  padding:9px 0;
  font-size:14px;
}

.watch-player{
  width:100%;
  background:#000;
  aspect-ratio:16/9;
  border-radius:12px;
  overflow:hidden;
}

.watch-player iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
}

.watch-title{
  font-size:18px;
  line-height:1.4;
  margin:13px 0 10px;
}

.watch-stat{
  color:var(--muted);
  font-size:12px;
  margin-bottom:13px;
}

.channel-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.channel-info{flex:1;min-width:0}

.channel-name{
  font-size:14px;
  font-weight:bold;
}

.channel-subs{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

.subscribe-button{
  border:0;
  border-radius:22px;
  background:white;
  color:#111;
  padding:9px 15px;
  font-weight:bold;
  font-size:13px;
}

.subscribe-button.subscribed{
  background:#303030;
  color:white;
}

.watch-actions{
  display:flex;
  justify-content:space-between;
  gap:7px;
  overflow-x:auto;
  padding:14px 0;
}

.watch-action{
  flex:0 0 auto;
  border:1px solid var(--border);
  border-radius:22px;
  background:#202020;
  color:white;
  padding:10px 13px;
  font-size:12px;
}

.watch-action.active{
  color:var(--gold);
  border-color:var(--gold);
}

/* DESCRIPTION */
.description-box{
  background:#191919;
  border-radius:12px;
  padding:13px;
  font-size:13px;
  line-height:1.6;
  margin-bottom:20px;
}

.description-box strong{color:var(--gold)}

/* COMMENTS */
.comments-section{margin-top:20px}

.comments-section h3{
  font-size:16px;
  margin:0 0 15px;
}

.comment-form{
  display:flex;
  gap:9px;
  margin-bottom:20px;
}

.comment-form input{
  min-width:0;
  flex:1;
  background:transparent;
  color:white;
  border:0;
  border-bottom:1px solid #555;
  padding:10px 3px;
}

.comment-form button{
  border:0;
  border-radius:20px;
  padding:8px 13px;
  background:var(--gold);
  color:#080808;
  font-weight:bold;
}

.comment-item{
  display:flex;
  gap:10px;
  margin:17px 0;
}

.comment-avatar{
  flex:0 0 34px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#303030;
  display:grid;
  place-items:center;
  color:var(--gold);
}

.comment-body{min-width:0;flex:1}

.comment-user{
  font-size:12px;
  font-weight:bold;
}

.comment-time{
  color:var(--muted);
  font-size:11px;
  margin-left:6px;
  font-weight:normal;
}

.comment-text{
  font-size:14px;
  line-height:1.5;
  margin:6px 0;
  overflow-wrap:anywhere;
}

.comment-buttons{
  display:flex;
  gap:15px;
}

.comment-buttons button{
  color:var(--muted);
  background:transparent;
  border:0;
  padding:3px 0;
  font-size:12px;
}

/* RECOMMENDATIONS */
.recommendations{margin-top:25px}
.recommendations h3{font-size:16px}

.recommendation-card{
  display:flex;
  gap:10px;
  margin:14px 0;
  cursor:pointer;
}

.recommendation-card img{
  width:43%;
  max-width:190px;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:9px;
}

.recommendation-info{min-width:0;flex:1}
.recommendation-info strong{
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  font-size:13px;
  line-height:1.4;
}

.recommendation-info small{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:6px;
}

/* SHORTS */
#shortsPage{
  margin:-10px -12px 0;
}

.shorts-feed{
  width:100%;
  max-width:500px;
  margin:auto;
  height:calc(100dvh - 145px);
  min-height:420px;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  overscroll-behavior:contain;
  scrollbar-width:none;
}

.shorts-feed::-webkit-scrollbar{display:none}

.short-card{
  position:relative;
  width:100%;
  height:100%;
  min-height:420px;
  max-height:850px;
  aspect-ratio:9/16;
  scroll-snap-align:start;
  overflow:hidden;
  background:#171717;
}

.short-background{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.short-player{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#000;
}

.short-shade{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    #0008 0%,
    transparent 24%,
    transparent 55%,
    #000b 100%
  );
  pointer-events:none;
}

.shorts-top{
  position:absolute;
  top:12px;
  left:14px;
  right:14px;
  display:flex;
  justify-content:flex-end;
  gap:20px;
  z-index:5;
}

.shorts-top button{
  border:0;
  background:#0005;
  color:white;
  font-size:23px;
  padding:6px;
}

.shorts-info{
  position:absolute;
  left:14px;
  right:76px;
  bottom:22px;
  z-index:5;
  color:white;
}

.short-channel{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:10px;
}

.short-avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--gold);
  color:#080808;
  display:grid;
  place-items:center;
  font-weight:bold;
}

.short-channel-name{
  font-size:15px;
  font-weight:bold;
}

.short-subscribe{
  border:0;
  border-radius:5px;
  background:white;
  color:#111;
  padding:7px 12px;
  font-size:12px;
  font-weight:bold;
}

.short-caption{
  font-size:14px;
  line-height:1.45;
  margin-bottom:10px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.short-music{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
  border-radius:8px;
  background:#0008;
  font-size:12px;
  font-style:italic;
  overflow:hidden;
  white-space:nowrap;
}

.short-music span{
  overflow:hidden;
  text-overflow:ellipsis;
}

.short-side{
  position:absolute;
  right:14px;
  bottom:25px;
  z-index:6;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:22px;
}

.short-side button{
  border:0;
  background:transparent;
  color:white;
  padding:0;
  text-align:center;
  font-size:23px;
  text-shadow:0 1px 5px #000;
}

.short-side small{
  display:block;
  font-size:11px;
  margin-top:4px;
}

.shorts-interest{
  position:absolute;
  z-index:7;
  left:12px;
  right:12px;
  bottom:5px;
  display:flex;
  gap:8px;
  transform:translateY(100%);
  opacity:0;
  pointer-events:none;
}

.shorts-interest button{
  flex:1;
  border:1px solid #ffffff55;
  border-radius:20px;
  padding:9px;
  background:#111d;
  color:white;
  font-size:12px;
}

.shorts-interest.show{
  transform:translateY(0);
  opacity:1;
  pointer-events:auto;
}

/* NAVIGASI GIRINATAN */
.bottom-nav{
  position:fixed;
  z-index:600;
  bottom:0;
  left:0;
  width:100%;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:8px 3px calc(7px + env(safe-area-inset-bottom));
  background:#101010;
  border-top:1px solid #806326;
}

.bottom-nav a{
  color:var(--muted);
  text-decoration:none;
  text-align:center;
  font-size:10px;
}

.bottom-nav a span{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.bottom-nav a.current{color:var(--gold)}

/* DESKTOP */
@media(min-width:650px){
  main{padding:15px 20px}
  .video-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .watch-layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px}
  .recommendations{margin-top:0}
  .shorts-feed{height:calc(100dvh - 145px)}
}

@media(min-width:1000px){
  .video-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  header{padding-left:25px;padding-right:25px}
}

@media(max-width:370px){
  .brand{font-size:17px}
  header{gap:6px;padding-left:8px;padding-right:8px}
  .header-icon{width:29px}
}
</style>
</head>

<body>

<!-- HEADER SELALU DI ATAS -->
<header>
  <div class="brand">GIRI<span>NATAN</span></div>

  <form class="header-search" id="searchForm">

<main>

    <button data-mode="shorts">Shorts</button>

    <div class="watch-main">

    <aside class="recommendations">

  </div>
</section>

<!-- SHORTS -->
<section class="page" id="shortsPage">
  <div class="shorts-feed" id="shortsFeed"></div>
</section>

</main>

<!-- NAVIGASI BAWAH GIRINATAN -->
<nav class="bottom-nav">
  <a href="../index.html">
    <span>⌂</span>Beranda
  </a>
  <a href="../index.html#karyaPage">
    <span>✦</span>Berkarya
  </a>
  <a href="../komunitas/index.html">
    <span>♧</span>Komunitas
  </a>

    <span>♙</span>Profil
  </a>

    <span>▣</span>Market
  </a>
</nav>

<script>
"use strict";

/* KONFIGURASI */
const WORKER_URL =
  "https://girinatanyoutube.mahrudin1999.workers.dev";

const STORAGE_FAVORITES = "girinatanyoutube_favorites";
const STORAGE_HISTORY = "girinatanyoutube_history";
const STORAGE_COMMENTS = "girinatanyoutube_comments";
const STORAGE_SUBSCRIPTIONS = "girinatanyoutube_subscriptions";
const STORAGE_REACTIONS = "girinatanyoutube_reactions";

const $ = id => document.getElementById(id);

let currentVideos = [];
let currentVideo = null;
let currentMode = "popular";
let requestNumber = 0;
let shortsVideos = [];

const categoryKeywords = {
  musik:"musik Indonesia terbaru",
  hiburan:"hiburan Indonesia",
  olahraga:"pertandingan olahraga Indonesia",
  berita:"berita Indonesia terbaru",
  gaming:"gameplay gaming Indonesia",
  pendidikan:"video edukasi pembelajaran",
  teknologi:"teknologi gadget terbaru",
  kuliner:"kuliner resep masakan Indonesia"
};

/* STORAGE */
function readStore(key){
  try{
    return JSON.parse(localStorage.getItem(key)||"[]");
  }catch{
    return [];
  }
}

function writeStore(key,data){
  try{
    localStorage.setItem(key,JSON.stringify(data));
  }catch{
    showMessage("Penyimpanan perangkat tidak tersedia.");
  }
}

function videoId(video){
  return typeof video.id==="object"
    ? video.id?.videoId
    : video.id;
}

function normalizeVideo(video){
  const snippet=video.snippet||{};
  return {
    id:videoId(video),
    title:snippet.title||"",
    channel:snippet.channelTitle||"YouTube",
    thumbnail:
      snippet.thumbnails?.high?.url||
      snippet.thumbnails?.medium?.url||
      snippet.thumbnails?.default?.url||"",
    publishedAt:snippet.publishedAt||"",
    views:video.statistics?.viewCount||"0",
    description:snippet.description||""
  };
}

function formatViews(value){
  const number=Number(value||0);
  if(number>=1000000)return (number/1000000).toFixed(1)+" jt";
  if(number>=1000)return (number/1000).toFixed(1)+" rb";
  return number.toLocaleString("id-ID");
}

function formatDate(value){
  if(!value)return "Tanggal tidak tersedia";
  return new Date(value).toLocaleDateString("id-ID",{
    day:"numeric",month:"short",year:"numeric"
  });
}

function showMessage(text){
  $("message").textContent=text;
}

/* NAVIGASI HALAMAN */
function showPage(pageId){
  document.querySelectorAll(".page").forEach(page=>{
    page.classList.remove("active");
  });
  $(pageId).classList.add("active");
  window.scrollTo({top:0,behavior:"instant"});
}

/* TAB KATEGORI */
function activateCategory(button){
  document.querySelectorAll("#categoryTabs button")
    .forEach(item=>item.classList.remove("active"));
  if(button)button.classList.add("active");
}

/* API YOUTUBE MELALUI WORKER */
async function fetchVideos(action,keyword=""){
  const request=++requestNumber;

  showMessage("Memuat video...");
  $("videoList").innerHTML="";
  $("videoCount").textContent="";

  try{
    const url=new URL(WORKER_URL);
    url.searchParams.set("action",action);
    if(keyword)url.searchParams.set("q",keyword);

    const response=await fetch(url.toString());
    const data=await response.json();

    if(request!==requestNumber)return;

    if(!response.ok||data.error){
      throw new Error(data.error?.message||"Gagal mengambil video.");
    }

    currentVideos=(data.items||[])
      .map(normalizeVideo)
      .filter(item=>item.id&&item.thumbnail);

    renderVideos(currentVideos);

  }catch(error){
    if(request!==requestNumber)return;
    showMessage("Gagal memuat video: "+error.message);

    const retry=document.createElement("button");
    retry.className="small-action";
    retry.textContent="Coba Lagi";
    retry.onclick=()=>fetchVideos(action,keyword);
    $("videoList").appendChild(retry);
  }
}

/* KARTU VIDEO */
function renderVideos(videos){
  const container=$("videoList");
  container.innerHTML="";

  if(!videos.length){
    showMessage("Video tidak ditemukan.");
    $("videoCount").textContent="0 video";
    return;
  }

  let count=0;

  videos.forEach(item=>{
    const card=document.createElement("article");
    card.className="video-card";

    const wrap=document.createElement("div");
    wrap.className="thumbnail-wrap";

    const img=document.createElement("img");
    img.className="thumbnail";
    img.src=item.thumbnail;
    img.alt=item.title;
    img.loading="lazy";
    img.decoding="async";

    const overlay=document.createElement("div");
    overlay.className="play-overlay";
    overlay.innerHTML="<span>▶</span>";

    wrap.append(img,overlay);
    wrap.addEventListener("click",()=>openWatch(item));

    const details=document.createElement("div");
    details.className="video-details";

    const avatar=document.createElement("div");
    avatar.className="channel-avatar";
    avatar.textContent=(item.channel||"G").charAt(0).toUpperCase();

    const text=document.createElement("div");
    text.className="video-text";

    const title=document.createElement("h3");
    title.className="video-title";
    title.textContent=item.title;

    const meta=document.createElement("div");
    meta.className="video-meta";
    meta.textContent=item.channel+" · "+formatViews(item.views)+
      " penayangan · "+formatDate(item.publishedAt);

    text.append(title,meta);
    details.append(avatar,text);

    const menu=document.createElement("button");
    menu.className="card-menu";
    menu.textContent="⋮";
    menu.setAttribute("aria-label","Menu video");
    menu.onclick=()=>shareVideo(item);

    details.appendChild(menu);

    const actions=document.createElement("div");
    actions.className="card-actions";

    const favorite=document.createElement("button");
    favorite.className="small-action";
    updateFavoriteButton(favorite,item);

    favorite.onclick=()=>{
      toggleFavorite(item);
      updateFavoriteButton(favorite,item);
    };

    const share=document.createElement("button");
    share.className="small-action";
    share.textContent="↗ Bagikan";
    share.onclick=()=>shareVideo(item);

    actions.append(favorite,share);
    card.append(wrap,details,actions);
    container.appendChild(card);
    count++;
  });

  showMessage("");
  $("videoCount").textContent=count+" video";
}

function updateFavoriteButton(button,item){
  const saved=readStore(STORAGE_FAVORITES)
    .some(video=>video.id===item.id);

  button.classList.toggle("saved",saved);
  button.textContent=saved?"♥ Tersimpan":"♡ Favorit";
}

/* BERANDA */
function home(){
  currentMode="popular";
  showPage("homePage");
  $("sectionTitle").textContent="Video Populer";
  $("searchInput").value="";
  activateCategory(document.querySelector('[data-mode="popular"]'));
  closeWatch();
  fetchVideos("popular");
}

/* PENCARIAN */
function searchVideos(keyword){
  keyword=keyword.trim();
  if(!keyword){
    showMessage("Masukkan kata pencarian.");
    return;
  }

  currentMode="search";
  showPage("homePage");
  $("sectionTitle").textContent="Hasil pencarian";
  activateCategory(null);
  closeWatch();
  fetchVideos("search",keyword);
}

/* KATEGORI */
function openCategory(category,button){
  const keyword=categoryKeywords[category];
  if(!keyword)return;

  currentMode="search";
  activateCategory(button);
  showPage("homePage");
  $("sectionTitle").textContent=
    "Kategori "+category.charAt(0).toUpperCase()+category.slice(1);

  closeWatch();
  fetchVideos("search",keyword);
}

/* FAVORIT DAN RIWAYAT */
function toggleFavorite(item){
  let data=readStore(STORAGE_FAVORITES);
  const exists=data.some(video=>video.id===item.id);

  data=exists
    ?data.filter(video=>video.id!==item.id)
    :[item,...data];

  writeStore(STORAGE_FAVORITES,data);
  showMessage(exists?"Dihapus dari favorit.":"Disimpan ke favorit.");
}

function saveHistory(item){
  let data=readStore(STORAGE_HISTORY);
  data=data.filter(video=>video.id!==item.id);
  data.unshift({...item,watchedAt:new Date().toISOString()});
  writeStore(STORAGE_HISTORY,data.slice(0,100));
}

function showCollection(type){
  currentMode=type;
  showPage("homePage");
  closeWatch();

  const data=readStore(
    type==="favorites"?STORAGE_FAVORITES:STORAGE_HISTORY
  );

  $("sectionTitle").textContent=
    type==="favorites"?"Video Favorit":"Riwayat Tontonan";

  $("videoList").innerHTML="";
  $("videoCount").textContent=data.length+" video";

  if(!data.length){
    showMessage("Belum ada video di bagian ini.");
    return;
  }

  showMessage("");
  renderVideos(data);
}

/* PEMBAGIAN TAUTAN */
async function shareVideo(item){
  const url="https://www.youtube.com/watch?v="+
    encodeURIComponent(item.id);

  try{
    if(navigator.share){
      await navigator.share({
        title:item.title,
        text:"Tonton video ini",
        url
      });
    }else{
      await navigator.clipboard.writeText(url);
      showMessage("Tautan berhasil disalin.");
    }
  }catch(error){
    if(error.name!=="AbortError"){
      window.prompt("Salin tautan video:",url);
    }
  }
}

/* HALAMAN TONTONAN */
function openWatch(item){
  currentVideo=item;
  showPage("watchPage");

  $("watchPlayer").src=
    "https://www.youtube-nocookie.com/embed/"+
    encodeURIComponent(item.id)+
    "?autoplay=1&rel=0";

  $("watchTitle").textContent=item.title;
  $("watchChannel").textContent=item.channel;
  $("watchAvatar").textContent=
    (item.channel||"G").charAt(0).toUpperCase();

  $("watchStats").textContent=
    formatViews(item.views)+" penayangan · "+
    formatDate(item.publishedAt);

  $("watchDescription").textContent=
    item.description||"Video diputar melalui pemutar resmi YouTube.";

  saveHistory(item);
  renderRecommendations();
  renderComments();
  updateWatchFavorite();
  updateSubscriptionButton();

  window.scrollTo({top:0,behavior:"instant"});
}

function closeWatch(){
  $("watchPlayer").src="";
  currentVideo=null;
}

function updateWatchFavorite(){
  if(!currentVideo)return;

  const saved=readStore(STORAGE_FAVORITES)
    .some(item=>item.id===currentVideo.id);

  $("saveWatchButton").textContent=
    saved?"★ Tersimpan":"☆ Simpan";

  $("saveWatchButton").classList.toggle("active",saved);
}

/* TOMBOL INTERAKSI LOKAL */
function getReaction(){
  const reactions=readStore(STORAGE_REACTIONS);
  return reactions.find(item=>item.id===currentVideo?.id);
}

function setReaction(type){
  if(!currentVideo)return;

  let data=readStore(STORAGE_REACTIONS);
  data=data.filter(item=>item.id!==currentVideo.id);

  if(type)data.push({id:currentVideo.id,type});

  writeStore(STORAGE_REACTIONS,data);

  $("likeButton").classList.toggle("active",type==="like");
  $("dislikeButton").classList.toggle("active",type==="dislike");
}

function updateSubscriptionButton(){
  if(!currentVideo)return;

  const subscriptions=readStore(STORAGE_SUBSCRIPTIONS);
  const exists=subscriptions.includes(currentVideo.channel);

  $("subscribeButton").textContent=
    exists?"Subscribed":"Subscribe";

  $("subscribeButton").classList.toggle("subscribed",exists);
}

/* KOMENTAR LOKAL */
function commentKey(){
  return currentVideo?"girinatanyoutube_comments_"+currentVideo.id:"";
}

function renderComments(){
  if(!currentVideo)return;

  const comments=readStore(commentKey());
  const container=$("commentList");
  container.innerHTML="";

  if(!comments.length){
    container.innerHTML=
      '<p class="message">Belum ada komentar GIRINATAN.</p>';
    return;
  }

  comments.forEach((comment,index)=>{
    const row=document.createElement("div");
    row.className="comment-item";

    const avatar=document.createElement("div");
    avatar.className="comment-avatar";
    avatar.textContent="G";

    const body=document.createElement("div");
    body.className="comment-body";

    const user=document.createElement("div");
    user.className="comment-user";
    user.textContent=comment.user||"Pengguna GIRINATAN";

    const time=document.createElement("span");
    time.className="comment-time";
    time.textContent=comment.time||"Baru saja";
    user.appendChild(time);

    const content=document.createElement("div");
    content.className="comment-text";
    content.textContent=comment.text;

    const buttons=document.createElement("div");
    buttons.className="comment-buttons";

    const like=document.createElement("button");
    like.textContent="♡ Suka ("+(comment.likes||0)+")";
    like.onclick=()=>{
      const updated=readStore(commentKey());
      updated[index].likes=(updated[index].likes||0)+1;
      writeStore(commentKey(),updated);
      renderComments();
    };

    const reply=document.createElement("button");
    reply.textContent="Balas";
    reply.onclick=()=>{
      $("commentInput").value="@"+(comment.user||"pengguna")+" ";
      $("commentInput").focus();
    };

    buttons.append(like,reply);
    body.append(user,content,buttons);
    row.append(avatar,body);
    container.appendChild(row);
  });
}

/* REKOMENDASI */
function renderRecommendations(){
  const container=$("recommendationList");
  container.innerHTML="";

  const videos=currentVideos.filter(
    item=>item.id!==currentVideo?.id
  );

  const recommendations=videos.length
    ?videos
    :readStore(STORAGE_HISTORY).filter(
      item=>item.id!==currentVideo?.id
    );

  recommendations.forEach(item=>{
    const row=document.createElement("div");
    row.className="recommendation-card";

    const img=document.createElement("img");
    img.src=item.thumbnail;
    img.alt=item.title;
    img.loading="lazy";

    const info=document.createElement("div");
    info.className="recommendation-info";

    const title=document.createElement("strong");
    title.textContent=item.title;

    const meta=document.createElement("small");
    meta.textContent=item.channel+" · "+formatViews(item.views)+" penayangan";

    info.append(title,meta);
    row.append(img,info);
    row.onclick=()=>openWatch(item);

    container.appendChild(row);
  });
}

/* SHORTS */
async function openShorts(){
  currentMode="shorts";
  showPage("shortsPage");

  const feed=$("shortsFeed");
  feed.innerHTML='<p class="message">Memuat Shorts...</p>';

  try{
    const url=new URL(WORKER_URL);
    url.searchParams.set("action","search");
    url.searchParams.set("q","YouTube Shorts Indonesia");

    const response=await fetch(url);
    const data=await response.json();

    if(!response.ok||data.error){
      throw new Error(data.error?.message||"Gagal memuat Shorts");
    }

    shortsVideos=(data.items||[])
      .map(normalizeVideo)
      .filter(item=>item.id&&item.thumbnail);

    renderShorts();

  }catch(error){
    feed.innerHTML="";
    const text=document.createElement("p");
    text.className="message";
    text.textContent="Gagal memuat Shorts: "+error.message;
    feed.appendChild(text);
  }
}

function renderShorts(){
  const feed=$("shortsFeed");
  feed.innerHTML="";

  if(!shortsVideos.length){
    feed.textContent="Belum ada video Shorts.";
    return;
  }

  shortsVideos.forEach(item=>{
    const card=document.createElement("article");
    card.className="short-card";

    const background=document.createElement("img");
    background.className="short-background";
    background.src=item.thumbnail;
    background.alt=item.title;
    background.loading="lazy";

    const shade=document.createElement("div");
    shade.className="short-shade";

    const top=document.createElement("div");
    top.className="shorts-top";

    const search=document.createElement("button");
    search.textContent="⌕";
    search.onclick=()=>{
      showPage("homePage");
      $("searchInput").focus();
    };

    const more=document.createElement("button");
    more.textContent="⋮";
    more.onclick=()=>{
      card.querySelector(".shorts-interest")
        .classList.toggle("show");
    };

    top.append(search,more);

    const info=document.createElement("div");
    info.className="shorts-info";

    const channel=document.createElement("div");
    channel.className="short-channel";

    const avatar=document.createElement("div");
    avatar.className="short-avatar";
    avatar.textContent=(item.channel||"G").charAt(0).toUpperCase();

    const name=document.createElement("div");
    name.className="short-channel-name";
    name.textContent=item.channel;

    const subscribe=document.createElement("button");
    subscribe.className="short-subscribe";
    subscribe.textContent="Subscribe";
    subscribe.onclick=()=>{
      let data=readStore(STORAGE_SUBSCRIPTIONS);
      if(!data.includes(item.channel)){
        data.push(item.channel);
        writeStore(STORAGE_SUBSCRIPTIONS,data);
        subscribe.textContent="Subscribed";
      }else{
        subscribe.textContent="Subscribed";
      }
    };

    channel.append(avatar,name,subscribe);

    const caption=document.createElement("div");
    caption.className="short-caption";
    caption.textContent=item.title;

    const music=document.createElement("div");
    music.className="short-music";
    music.innerHTML="♫ <span>Suara asli · "+escapeHTML(item.channel)+"</span>";

    info.append(channel,caption,music);

    const side=document.createElement("div");
    side.className="short-side";

    const like=document.createElement("button");
    like.innerHTML="♡<small>Suka</small>";
    like.onclick=()=>{
      like.innerHTML="♥<small>Disukai</small>";
    };

    const comment=document.createElement("button");
    comment.innerHTML="▢<small>Komentar</small>";
    comment.onclick=()=>openWatch(item);

    const share=document.createElement("button");
    share.innerHTML="↗<small>Bagikan</small>";
    share.onclick=()=>shareVideo(item);

    const save=document.createElement("button");
    save.innerHTML="☆<small>Simpan</small>";
    save.onclick=()=>{
      toggleFavorite(item);
      save.innerHTML="★<small>Tersimpan</small>";
    };

    side.append(like,comment,share,save);

    const interest=document.createElement("div");
    interest.className="shorts-interest";

    const no=document.createElement("button");
    no.textContent="Tidak tertarik";
    no.onclick=()=>card.remove();

    const yes=document.createElement("button");
    yes.textContent="Tertarik";
    yes.onclick=()=>card.remove();

    interest.append(no,yes);

    const play=document.createElement("button");
    play.textContent="▶ Tonton video";
    play.style.cssText=
      "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;border:0;border-radius:25px;padding:10px 16px;background:#000b;color:white";
    play.onclick=()=>openWatch(item);

    card.append(background,shade,top,info,side,interest,play);
    feed.appendChild(card);
  });
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,char=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#039;"
  })[char]);
}

/* EVENT SEARCH */
$("searchForm").addEventListener("submit",event=>{
  event.preventDefault();
  searchVideos($("searchInput").value);
});

/* EVENT CATEGORY */
document.querySelectorAll("#categoryTabs button")
  .forEach(button=>{
    button.addEventListener("click",()=>{
      if(button.dataset.mode==="popular"){
        home();
      }else if(button.dataset.mode==="shorts"){
        activateCategory(button);
        openShorts();
      }else if(button.dataset.category){
        openCategory(button.dataset.category,button);
      }
    });
  });

/* EVENT KOLEKSI */
$("savedButton").onclick=()=>showCollection("favorites");
$("historyButton").onclick=()=>showCollection("history");

/* EVENT HALAMAN TONTONAN */
$("backHome").onclick=()=>{
  closeWatch();
  home();
};

$("likeButton").onclick=()=>{
  const current=getReaction();
  setReaction(current?.type==="like"?null:"like");
};

$("dislikeButton").onclick=()=>{
  const current=getReaction();
  setReaction(current?.type==="dislike"?null:"dislike");
};

$("shareButton").onclick=()=>{
  if(currentVideo)shareVideo(currentVideo);
};

$("saveWatchButton").onclick=()=>{
  if(!currentVideo)return;
  toggleFavorite(currentVideo);
  updateWatchFavorite();
};

$("subscribeButton").onclick=()=>{
  if(!currentVideo)return;

  let data=readStore(STORAGE_SUBSCRIPTIONS);

  if(data.includes(currentVideo.channel)){
    data=data.filter(name=>name!==currentVideo.channel);
  }else{
    data.push(currentVideo.channel);
  }

  writeStore(STORAGE_SUBSCRIPTIONS,data);
  updateSubscriptionButton();
};

$("moreButton").onclick=()=>{
  if(currentVideo)shareVideo(currentVideo);
};

/* KOMENTAR */
$("commentForm").addEventListener("submit",event=>{
  event.preventDefault();

  if(!currentVideo)return;

  const text=$("commentInput").value.trim();
  if(!text)return;

  const comments=readStore(commentKey());

  comments.unshift({
    user:"Pengguna GIRINATAN",
    text,
    time:"Baru saja",
    likes:0
  });

  writeStore(commentKey(),comments);
  $("commentInput").value="";
  renderComments();
});

/* HEADER */
$("notificationButton").onclick=()=>{
  alert("Fitur notifikasi GIRINATAN akan dihubungkan ke sistem notifikasi.");
};

$("profileButton").onclick=()=>{
  window.location.href="../index.html#accountPage";
};

/* MULAI */
home();

</script>
