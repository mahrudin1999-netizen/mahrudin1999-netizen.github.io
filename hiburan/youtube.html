
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube - GIRINATAN</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#080808;color:white;
  font-family:Arial,sans-serif;padding-bottom:80px;
}
header{
  padding:16px;background:#141414;
  border-bottom:1px solid #806326;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{font-size:20px;font-weight:bold}
.brand span{color:#D6AD48}
main{max-width:760px;margin:auto;padding:15px}
h2{color:#D6AD48;margin-top:10px}
.search{
  display:flex;gap:8px;margin:15px 0;
}
input{
  min-width:0;flex:1;padding:13px;
  border-radius:10px;border:1px solid #343434;
  background:#151515;color:white;
}
button{
  border:0;border-radius:9px;padding:12px;
  background:#D6AD48;color:#080808;font-weight:bold;
}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:15px 0}
.tabs button{white-space:nowrap;background:#202020;color:white}
.tabs button.active{background:#D6AD48;color:#080808}
#message{color:#A8ADA8;font-size:13px}
.video{
  margin-bottom:22px;cursor:pointer;
}
.thumb{
  width:100%;aspect-ratio:16/9;object-fit:cover;
  border-radius:12px;background:#202020;
}
.video h3{font-size:15px;margin:9px 0 5px}
.video small{color:#A8ADA8}
#playerBox{
  display:none;margin:15px 0 22px;
}
#player{
  width:100%;aspect-ratio:16/9;border:0;
  border-radius:12px;background:#151515;
}
#playingTitle{color:#D6AD48;font-size:15px}
nav{
  position:fixed;bottom:0;left:0;width:100%;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:#111;border-top:1px solid #806326;
  padding:11px 4px;text-align:center;
}
nav a{
  color:#A8ADA8;text-decoration:none;font-size:11px;
}
nav a span{display:block;font-size:19px;margin-bottom:4px}
</style>
</head>

<body>

<header>
  <div class="brand">GIRI<span>NATAN</span></div>
  <strong style="color:#D6AD48">▶ YouTube</strong>
</header>

<main>
  <div class="search">
    <input id="searchInput" placeholder="Cari video YouTube...">
    <button onclick="cariVideo()">Cari</button>
  </div>

  <div class="tabs">
    <button class="active" onclick="beranda(this)">Untuk Anda</button>
    <button onclick="kategori('musik',this)">Musik</button>
    <button onclick="kategori('hiburan',this)">Hiburan</button>
    <button onclick="kategori('olahraga',this)">Olahraga</button>
    <button onclick="kategori('berita',this)">Berita</button>
  </div>

  <div id="playerBox">
    <iframe id="player" allowfullscreen
      allow="accelerometer; autoplay; encrypted-media; picture-in-picture">
    </iframe>
    <h3 id="playingTitle"></h3>
  </div>

  <p id="message">Memuat video...</p>
  <div id="videoList"></div>
</main>

<nav>
  <a href="../index.html"><span>⌂</span>Beranda</a>
  <a href="../index.html#marketPage"><span>▣</span>Market</a>
  <a href="../index.html#karyaPage"><span>✦</span>Berkarya</a>
  <a href="../komunitas/index.html"><span>♧</span>Komunitas</a>
  <a href="../index.html#accountPage"><span>♙</span>Akun</a>
</nav>

<script>
const API_KEY = AIzaSyB71yeTnuk7pwNUT4dU_NqBTRplwBMQtNE

const list = document.getElementById("videoList");
const message = document.getElementById("message");

function tampilkanPesan(teks){
  message.textContent=teks;
}

function tampilkanVideo(videos){
  list.innerHTML="";

  if(!videos || videos.length===0){
    tampilkanPesan("Video tidak ditemukan.");
    return;
  }

  tampilkanPesan("");

  videos.forEach(video=>{
    const id=video.id.videoId || video.id;
    const data=video.snippet;

    const card=document.createElement("div");
    card.className="video";

    const img=document.createElement("img");
    img.className="thumb";
    img.src=data.thumbnails.medium.url;
    img.alt=data.title;

    const title=document.createElement("h3");
    title.textContent=data.title;

    const channel=document.createElement("small");
    channel.textContent=data.channelTitle;

    card.append(img,title,channel);

    card.onclick=()=>putarVideo(id,data.title);

    list.appendChild(card);
  });
}

function putarVideo(id,title){
  document.getElementById("playerBox").style.display="block";
  document.getElementById("player").src=
    "https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id);
  document.getElementById("playingTitle").textContent=title;

  document.getElementById("playerBox").scrollIntoView({
    behavior:"smooth"
  });
}

async function ambilVideo(url){
  try{
    tampilkanPesan("Memuat video...");

    const response=await fetch(url);
    const data=await response.json();

    if(!response.ok || data.error){
      throw new Error(
        data.error?.message || "Gagal mengambil video."
      );
    }

    tampilkanVideo(data.items);
  }catch(error){
    tampilkanPesan("Gagal memuat: "+error.message);
  }
}

function beranda(button){
  pilihTab(button);
  const url=
    "https://www.googleapis.com/youtube/v3/videos"+
    "?part=snippet&chart=mostPopular&regionCode=ID"+
    "&maxResults=15&key="+API_KEY;

  ambilVideo(url);
}

function cariVideo(){
  const kata=document.getElementById("searchInput").value.trim();

  if(!kata){
    tampilkanPesan("Masukkan kata pencarian.");
    return;
  }

  const url=
    "https://www.googleapis.com/youtube/v3/search"+
    "?part=snippet&type=video&maxResults=15"+
    "&q="+encodeURIComponent(kata)+
    "&regionCode=ID&key="+API_KEY;

  ambilVideo(url);
}

function kategori(kata,button){
  pilihTab(button);
  document.getElementById("searchInput").value=kata;
  cariVideo();
}

function pilihTab(button){
  document.querySelectorAll(".tabs button").forEach(b=>{
    b.classList.remove("active");
  });
  button.classList.add("active");
}

document.getElementById("searchInput")
.addEventListener("keydown",event=>{
  if(event.key==="Enter")cariVideo();
});

if(API_KEY==="MASUKKAN_API_KEY_KAMU_DI_SINI"){
  tampilkanPesan("API Key belum dipasang.");
}else{
  beranda(document.querySelector(".tabs button"));
}
</script>

</body>
</html>
