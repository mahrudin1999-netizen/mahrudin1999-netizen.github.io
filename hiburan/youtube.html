
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>YouTube - GIRINATAN</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding-bottom: 80px;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  padding: 17px 16px;
  background: #080808;
  border-bottom: 1px solid #292929;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: .5px;
}

.brand span {
  color: #D6AD48;
}

header strong {
  color: #D6AD48;
}

main {
  width: 100%;
  max-width: 1200px;
  margin: auto;
  padding: 15px;
}

h2 {
  color: #D6AD48;
}

.search {
  display: flex;
  gap: 9px;
  margin: 17px 0;
}

input {
  min-width: 0;
  flex: 1;
  padding: 14px 16px;
  border-radius: 25px;
  border: 1px solid #343434;
  background: #151515;
  color: white;
  font-size: 14px;
  outline: none;
}

input:focus {
  border-color: #D6AD48;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 12px;
  background: #D6AD48;
  color: #080808;
  font-weight: bold;
  cursor: pointer;
}

.search button {
  border-radius: 25px;
  padding: 0 20px;
  background: linear-gradient(135deg, #E5C36A, #B88A2E);
}

/* Tombol beranda video */
#homeButton {
  background: #202020;
  color: #D6AD48;
  border: 1px solid #806326;
  padding: 10px 14px;
}

/* Kategori horizontal */
.tabs {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  overflow-y: hidden;
  margin: 18px 0 22px;
  padding: 3px 2px 10px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tabs button {
  flex: 0 0 auto;
  white-space: nowrap;
  padding: 10px 17px;
  border-radius: 20px;
  background: #202020;
  color: #ddd;
  border: 1px solid #343434;
  font-size: 13px;
}

.tabs button.active {
  background: linear-gradient(135deg, #E5C36A, #B88A2E);
  color: #080808;
  border-color: #D6AD48;
  box-shadow: 0 3px 12px rgba(214,173,72,.2);
}

/* Pesan */
#message {
  color: #A8ADA8;
  font-size: 13px;
  margin: 12px 0;
}

/* Daftar video */
.video-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px 16px;
}

.video {
  min-width: 0;
  margin-bottom: 5px;
  cursor: pointer;
  overflow: hidden;
  transition: transform .2s ease;
}

.video:active {
  transform: scale(.98);
}

.thumb {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  border-radius: 13px;
  background: #202020;
  border: 1px solid #292929;
  display: block;
}

.video h3 {
  font-size: 15px;
  line-height: 1.5;
  margin: 11px 0 5px;
  color: #fff;
  font-weight: 600;
}

.video small {
  display: block;
  color: #A8ADA8;
  font-size: 12px;
  line-height: 1.7;
  margin-top: 3px;
}

/* Tampilan kartu Shorts */
.video.shorts-mode {
  width: 100%;
  max-width: 260px;
  margin: 0 auto;
}

.video.shorts-mode .thumb {
  aspect-ratio: 9 / 16;
  max-height: 420px;
  object-fit: cover;
  border-radius: 14px;
}

/* Pemutar YouTube */
#playerBox {
  display: none;
  width: 100%;
  margin: 20px auto;
  padding: 12px;
  background: #141414;
  border: 1px solid #D6AD48;
  border-radius: 12px;
}

#player {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  border: none;
  border-radius: 8px;
  background: #000;
}

#playingTitle {
  color: #D6AD48;
  font-size: 16px;
  line-height: 1.5;
  margin: 12px 0 4px;
}

.close-player {
  background: #202020;
  color: #D6AD48;
  border: 1px solid #D6AD48;
  padding: 9px 15px;
  border-radius: 8px;
  margin-bottom: 10px;
}

.close-player:hover {
  background: #D6AD48;
  color: #080808;
}

/* Navigasi bawah */
nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: #111;
  border-top: 1px solid #806326;
  padding: 11px 4px;
  text-align: center;
  z-index: 200;
}

nav a {
  color: #A8ADA8;
  text-decoration: none;
  font-size: 11px;
}

nav a span {
  display: block;
  font-size: 19px;
  margin-bottom: 4px;
}

/* Tablet */
@media (min-width: 600px) {
  .video-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Komputer */
@media (min-width: 1000px) {
  .video-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* Tampilan Shorts di layar besar */
.shorts-grid {
  grid-template-columns: repeat(
    auto-fill,
    minmax(180px, 1fr)
  );
  align-items: start;
}

@media (max-width: 599px) {
  .shorts-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .video.shorts-mode {
    max-width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">GIRI<span>NATAN</span></div>
  <strong>▶ YouTube</strong>
</header>

<main>

  <div class="search">
    <input
      id="searchInput"
      type="search"
      placeholder="Cari video YouTube..."
    >
    <button onclick="cariVideo()">Cari</button>
  </div>

  <button id="homeButton" onclick="kembaliBeranda()">
    🏠 Beranda Video
  </button>

  <div class="tabs">
    <button class="active" onclick="beranda(this)">Untuk Anda</button>
    <button onclick="shorts(this)">▶ Shorts</button>
    <button onclick="kategori('musik',this)">Musik</button>
    <button onclick="kategori('hiburan',this)">Hiburan</button>
    <button onclick="kategori('olahraga',this)">Olahraga</button>
    <button onclick="kategori('berita',this)">Berita</button>
    <button onclick="kategori('gaming',this)">Gaming</button>
    <button onclick="kategori('pendidikan',this)">Pendidikan</button>
    <button onclick="kategori('teknologi',this)">Teknologi</button>
    <button onclick="kategori('kuliner',this)">Kuliner</button>
  </div>

  <div id="playerBox">
    <button
      onclick="tutupPemutar()"
      class="close-player"
    >
      ✕ Tutup Pemutar
    </button>

    <iframe
      id="player"
      allowfullscreen
      allow="accelerometer; autoplay; encrypted-media; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

    <h3 id="playingTitle"></h3>
  </div>

  <p id="message">Memuat video...</p>

  <div id="videoList" class="video-grid"></div>

</main>

<nav>
  <a href="../index.html">
    <span>⌂</span>Beranda
  </a>

  <a href="../index.html#marketPage">
    <span>▣</span>Market
  </a>

  <a href="../index.html#karyaPage">
    <span>✦</span>Berkarya
  </a>

  <a href="../komunitas/index.html">
    <span>♧</span>Komunitas
  </a>

  <a href="../index.html#accountPage">
    <span>♙</span>Akun
  </a>
</nav>

<script>
const WORKER_URL =
  "https://girinatanyoutube.mahrudin1999.workers.dev";

const list = document.getElementById("videoList");
const message = document.getElementById("message");
const searchInput = document.getElementById("searchInput");
const playerBox = document.getElementById("playerBox");
const player = document.getElementById("player");

function tampilkanPesan(teks) {
  message.textContent = teks;
}

function tampilkanVideo(videos) {
  list.innerHTML = "";

  if (!videos || videos.length === 0) {
    tampilkanPesan("Video tidak ditemukan.");
    return;
  }

  let jumlahVideo = 0;

  videos.forEach(video => {
    const id = typeof video.id === "object"
      ? video.id?.videoId
      : video.id;

    const data = video.snippet;

    if (!id || !data) return;

    const thumbnail =
      data.thumbnails?.medium?.url ||
      data.thumbnails?.default?.url;

    if (!thumbnail) return;

    const card = document.createElement("div");
    card.className = "video";

    if (list.classList.contains("shorts-grid")) {
      card.classList.add("shorts-mode");
    }

    const img = document.createElement("img");
    img.className = "thumb";
    img.loading = "lazy";
    img.decoding = "async";
    img.src = thumbnail;
    img.alt = data.title || "Video YouTube";

    const title = document.createElement("h3");
    title.textContent = data.title || "Video tanpa judul";

    const channel = document.createElement("small");
    channel.textContent = data.channelTitle || "Kanal YouTube";

    const views = document.createElement("small");
    const jumlah = video.statistics?.viewCount;

    views.textContent = jumlah
      ? Number(jumlah).toLocaleString("id-ID") + " penayangan"
      : "Jumlah penayangan tidak tersedia";

    const tanggal = document.createElement("small");

    tanggal.textContent = data.publishedAt
      ? new Date(data.publishedAt).toLocaleDateString("id-ID")
      : "Tanggal tidak tersedia";

    card.append(img, title, channel, views, tanggal);

    card.onclick = () => putarVideo(id, data.title);

    list.appendChild(card);
    jumlahVideo++;
  });

  tampilkanPesan(
    jumlahVideo ? "" : "Video tidak ditemukan."
  );
}

function putarVideo(id, title) {
  playerBox.style.display = "block";

  player.src =
    "https://www.youtube-nocookie.com/embed/" +
    encodeURIComponent(id);

  document.getElementById("playingTitle").textContent = title;

  playerBox.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function tutupPemutar() {
  player.src = "";
  playerBox.style.display = "none";
}

async function ambilVideo(action, kata = "") {
  try {
    tampilkanPesan("Memuat video...");
    list.innerHTML = "";

    const url = new URL(WORKER_URL);

    url.searchParams.set("action", action);

    if (kata) {
      url.searchParams.set("q", kata);
    }

    const response = await fetch(url.toString());
    const data = await response.json();

    if (!response.ok || data.error) {
      throw new Error(
        data.error?.message || "Gagal mengambil video."
      );
    }

    tampilkanVideo(data.items);

  } catch (error) {
    tampilkanPesan(
      "Gagal memuat video: " + error.message
    );

    list.innerHTML = "";

    const retry = document.createElement("button");
    retry.textContent = "↻ Coba Lagi";

    retry.onclick = () => ambilVideo(action, kata);

    list.appendChild(retry);
  }
}

function pilihTab(button) {
  document.querySelectorAll(".tabs button").forEach(b => {
    b.classList.remove("active");
  });

  button.classList.add("active");
}

function beranda(button) {
  pilihTab(button);
  list.classList.remove("shorts-grid");
  searchInput.value = "";

  ambilVideo("popular");
}

function shorts(button) {
  pilihTab(button);
  list.classList.add("shorts-grid");

  searchInput.value = "YouTube Shorts Indonesia";

  ambilVideo("search", "YouTube Shorts Indonesia");
}

function kembaliBeranda() {
  beranda(document.querySelector(".tabs button"));
}

function cariVideo() {
  const kata = searchInput.value.trim();

  if (!kata) {
    tampilkanPesan("Masukkan kata pencarian.");
    return;
  }

  list.classList.remove("shorts-grid");

  document.querySelectorAll(".tabs button").forEach(b => {
    b.classList.remove("active");
  });

  ambilVideo("search", kata);
}

function kategori(kata, button) {
  const kataKunci = {
    musik: "musik Indonesia terbaru",
    hiburan: "hiburan Indonesia",
    olahraga: "berita dan pertandingan olahraga",
    berita: "berita Indonesia terbaru",
    gaming: "gameplay gaming Indonesia",
    pendidikan: "video edukasi pembelajaran Indonesia",
    teknologi: "teknologi dan gadget terbaru",
    kuliner: "kuliner dan resep masakan Indonesia"
  };

  pilihTab(button);
  list.classList.remove("shorts-grid");

  const pencarian = kataKunci[kata] || kata;

  searchInput.value = pencarian;

  ambilVideo("search", pencarian);
}

searchInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    cariVideo();
  }
});

/* Muat video populer saat halaman dibuka */
beranda(document.querySelector(".tabs button"));

</script>

</body>
</html>
