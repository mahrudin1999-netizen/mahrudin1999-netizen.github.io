<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>YouTube - GIRINATAN</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #080808;
  --panel: #151515;
  --panel2: #202020;
  --gold: #D6AD48;
  --green: #00C875;
  --text: #fff;
  --muted: #A8ADA8;
  --border: #343434;
}

body {
  margin: 0;
  padding-bottom: 82px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

button, input {
  font-family: inherit;
}

button {
  cursor: pointer;
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 15px 16px;
  background: rgba(8,8,8,.97);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  font-size: 21px;
  font-weight: 800;
}

.brand span {
  color: var(--gold);
}

.header-label {
  color: var(--gold);
  font-weight: bold;
}

main {
  width: 100%;
  max-width: 1200px;
  margin: auto;
  padding: 15px;
}

.search {
  display: flex;
  gap: 8px;
  margin: 14px 0;
}

.search input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 25px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: white;
  outline: none;
}

.search input:focus {
  border-color: var(--gold);
}

button {
  border: 0;
  border-radius: 9px;
  padding: 10px 14px;
  background: var(--gold);
  color: #080808;
  font-weight: bold;
}

.search button {
  border-radius: 25px;
  background: linear-gradient(135deg,#E5C36A,#B88A2E);
}

.top-actions {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 3px 0 10px;
  scrollbar-width: none;
}

.top-actions::-webkit-scrollbar {
  display: none;
}

.secondary-btn {
  flex: 0 0 auto;
  background: var(--panel2);
  color: var(--gold);
  border: 1px solid #806326;
}

.secondary-btn.active {
  background: var(--gold);
  color: #080808;
}

.tabs {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding: 8px 0 13px;
  margin: 8px 0 15px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tabs button {
  flex: 0 0 auto;
  white-space: nowrap;
  border-radius: 20px;
  padding: 10px 16px;
  background: var(--panel2);
  color: #ddd;
  border: 1px solid var(--border);
  font-size: 13px;
}

.tabs button.active {
  background: linear-gradient(135deg,#E5C36A,#B88A2E);
  color: #080808;
  border-color: var(--gold);
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 16px 0;
}

.section-heading h2 {
  font-size: 17px;
  color: var(--gold);
  margin: 0;
}

.section-heading small {
  color: var(--muted);
}

#message {
  color: var(--muted);
  font-size: 13px;
  margin: 12px 0;
}

.video-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px 16px;
}

.video {
  min-width: 0;
  overflow: hidden;
  border-radius: 12px;
  background: transparent;
}

.thumb-wrap {
  position: relative;
}

.thumb {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: var(--panel2);
  border-radius: 12px;
}

.play-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.12);
  pointer-events: none;
}

.play-overlay span {
  background: rgba(0,0,0,.78);
  color: white;
  padding: 10px 16px;
  border-radius: 30px;
  font-size: 22px;
}

.video h3 {
  font-size: 14px;
  line-height: 1.5;
  margin: 10px 0 5px;
}

.video small {
  display: block;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.video-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.video-actions button {
  flex: 1;
  padding: 8px 6px;
  font-size: 12px;
  background: var(--panel2);
  color: var(--gold);
  border: 1px solid var(--border);
}

.video-actions button.saved {
  color: var(--green);
  border-color: var(--green);
}

.video-play {
  width: 100%;
  padding: 9px;
  margin-top: 9px;
  background: linear-gradient(135deg,#E5C36A,#B88A2E);
}

/* Shorts */
.shorts-grid {
  display: flex;
  flex-direction: column;
  gap: 22px;
  max-width: 520px;
  margin: auto;
}

.video.shorts-mode {
  width: 100%;
  scroll-snap-align: start;
}

.video.shorts-mode .thumb {
  aspect-ratio: 9 / 16;
  max-height: 72vh;
  object-fit: cover;
}

.shorts-grid .video {
  padding-bottom: 15px;
  border-bottom: 1px solid var(--border);
}

.shorts-grid .video h3 {
  font-size: 15px;
}

/* Pemutar */
#playerBox {
  display: none;
  width: 100%;
  margin: 20px 0;
  padding: 12px;
  background: var(--panel);
  border: 1px solid var(--gold);
  border-radius: 14px;
}

#player {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  border-radius: 9px;
  background: #000;
}

#playingTitle {
  color: var(--gold);
  font-size: 15px;
  line-height: 1.5;
}

.close-player {
  background: var(--panel2);
  color: var(--gold);
  border: 1px solid var(--gold);
  margin-bottom: 10px;
}

/* Koleksi */
.empty-state {
  text-align: center;
  color: var(--muted);
  padding: 45px 15px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
}

.empty-state strong {
  display: block;
  color: var(--gold);
  font-size: 17px;
  margin-bottom: 8px;
}

/* Navigasi */
nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  z-index: 200;
  display: grid;
  grid-template-columns: repeat(5,1fr);
  background: #111;
  border-top: 1px solid #806326;
  padding: 10px 4px;
  text-align: center;
}

nav a {
  text-decoration: none;
  color: var(--muted);
  font-size: 11px;
}

nav a span {
  display: block;
  font-size: 19px;
  margin-bottom: 4px;
}

nav a.current {
  color: var(--gold);
}

@media(min-width:600px) {
  .video-grid:not(.shorts-grid) {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }
}

@media(min-width:1000px) {
  .video-grid:not(.shorts-grid) {
    grid-template-columns: repeat(3,minmax(0,1fr));
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">GIRI<span>NATAN</span></div>
  <div class="header-label">▶ YouTube</div>
</header>

<main>

  <div class="search">
    <input
      id="searchInput"
      type="search"
      placeholder="Cari video YouTube..."
    >
    <button id="searchButton">Cari</button>
  </div>

  <div class="top-actions">
    <button class="secondary-btn active" id="homeButton">
      🏠 Beranda
    </button>
    <button class="secondary-btn" id="savedButton">
      ♥ Favorit
    </button>
    <button class="secondary-btn" id="historyButton">
      ◷ Riwayat
    </button>
  </div>

  <div class="tabs" id="categoryTabs">
    <button class="active" data-mode="popular">Untuk Anda</button>
    <button data-mode="shorts">▶ Shorts</button>
    <button data-category="musik">Musik</button>
    <button data-category="hiburan">Hiburan</button>
    <button data-category="olahraga">Olahraga</button>
    <button data-category="berita">Berita</button>
    <button data-category="gaming">Gaming</button>
    <button data-category="pendidikan">Pendidikan</button>
    <button data-category="teknologi">Teknologi</button>
    <button data-category="kuliner">Kuliner</button>
  </div>

  <div id="playerBox">
    <button class="close-player" id="closePlayer">
      ✕ Tutup Pemutar
    </button>

    <iframe
      id="player"
      allowfullscreen
      allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

    <h3 id="playingTitle"></h3>
    <button class="secondary-btn" id="sharePlaying">
      ↗ Bagikan video
    </button>
  </div>

  <div class="section-heading">
    <h2 id="sectionTitle">Video Populer</h2>
    <small id="videoCount"></small>
  </div>

  <p id="message">Memuat video...</p>

  <div id="videoList" class="video-grid"></div>

</main>

<nav>
  <a href="../index.html">
    <span>⌂</span>Beranda
  </a>
  <a href="../index.html#marketPage">
    <span>▣</span>Market
  </a>
  <a href="../index.html#karyaPage">
    <span>✦</span>Berkarya
  </a>
  <a href="../komunitas/index.html">
    <span>♧</span>Komunitas
  </a>
  <a href="../index.html#accountPage">
    <span>♙</span>Akun
  </a>
</nav>

<script>
"use strict";

/* KONFIGURASI */
const WORKER_URL =
  "https://girinatanyoutube.mahrudin1999.workers.dev";

const STORAGE_FAVORITES = "girinatanyoutube_favorites";
const STORAGE_HISTORY = "girinatanyoutube_history";

const list = document.getElementById("videoList");
const message = document.getElementById("message");
const searchInput = document.getElementById("searchInput");
const playerBox = document.getElementById("playerBox");
const player = document.getElementById("player");

let currentVideos = [];
let currentVideo = null;
let currentMode = "popular";
let requestNumber = 0;

const categoryKeywords = {
  musik: "musik Indonesia terbaru",
  hiburan: "hiburan Indonesia",
  olahraga: "berita dan pertandingan olahraga",
  berita: "berita Indonesia terbaru",
  gaming: "gameplay gaming Indonesia",
  pendidikan: "video edukasi pembelajaran Indonesia",
  teknologi: "teknologi dan gadget terbaru",
  kuliner: "kuliner dan resep masakan Indonesia"
};

/* PENYIMPANAN LOKAL */
function bacaPenyimpanan(key) {
  try {
    return JSON.parse(localStorage.getItem(key) || "[]");
  } catch {
    return [];
  }
}

function simpanPenyimpanan(key, data) {
  try {
    localStorage.setItem(key, JSON.stringify(data));
  } catch {
    tampilkanPesan("Penyimpanan perangkat tidak tersedia.");
  }
}

function ambilID(video) {
  return typeof video.id === "object"
    ? video.id?.videoId
    : video.id;
}

function dataVideo(video) {
  return {
    id: ambilID(video),
    title: video.snippet?.title || "",
    channel: video.snippet?.channelTitle || "",
    thumbnail:
      video.snippet?.thumbnails?.medium?.url ||
      video.snippet?.thumbnails?.default?.url ||
      "",
    publishedAt: video.snippet?.publishedAt || "",
    views: video.statistics?.viewCount || "0"
  };
}

/* PESAN */
function tampilkanPesan(teks) {
  message.textContent = teks;
}

/* TAB */
function pilihTab(button) {
  document.querySelectorAll("#categoryTabs button")
    .forEach(item => item.classList.remove("active"));

  if (button) button.classList.add("active");
}

function pilihTampilan(button) {
  document.querySelectorAll(".top-actions button")
    .forEach(item => item.classList.remove("active"));

  button.classList.add("active");
}

/* MEMUAT VIDEO */
async function ambilVideo(action, kata = "") {
  const nomorPermintaan = ++requestNumber;

  try {
    tampilkanPesan("Memuat video...");
    list.innerHTML = "";
    document.getElementById("videoCount").textContent = "";

    const url = new URL(WORKER_URL);
    url.searchParams.set("action", action);

    if (kata) url.searchParams.set("q", kata);

    const response = await fetch(url.toString());
    const data = await response.json();

    if (nomorPermintaan !== requestNumber) return;

    if (!response.ok || data.error) {
      throw new Error(
        data.error?.message || "Gagal mengambil video."
      );
    }

    currentVideos = data.items || [];
    tampilkanVideo(currentVideos);

  } catch (error) {
    if (nomorPermintaan !== requestNumber) return;

    tampilkanPesan("Gagal memuat video: " + error.message);
    list.innerHTML = "";

    const retry = document.createElement("button");
    retry.textContent = "↻ Coba Lagi";
    retry.onclick = () => ambilVideo(action, kata);

    list.appendChild(retry);
  }
}

/* KARTU VIDEO */
function tampilkanVideo(videos) {
  list.innerHTML = "";

  if (!videos || !videos.length) {
    tampilkanPesan("Video tidak ditemukan.");
    return;
  }

  let total = 0;

  videos.forEach(video => {
    const item = dataVideo(video);

    if (!item.id || !item.thumbnail) return;

    const card = document.createElement("article");
    card.className = "video";

    if (currentMode === "shorts") {
      card.classList.add("shorts-mode");
    }

    const thumbWrap = document.createElement("div");
    thumbWrap.className = "thumb-wrap";

    const img = document.createElement("img");
    img.className = "thumb";
    img.src = item.thumbnail;
    img.alt = item.title;
    img.loading = "lazy";
    img.decoding = "async";

    const overlay = document.createElement("div");
    overlay.className = "play-overlay";

    const playIcon = document.createElement("span");
    playIcon.textContent = "▶";

    overlay.appendChild(playIcon);
    thumbWrap.append(img, overlay);

    thumbWrap.addEventListener("click", () => putarVideo(item));

    const title = document.createElement("h3");
    title.textContent = item.title;

    const channel = document.createElement("small");
    channel.textContent = item.channel;

    const views = document.createElement("small");
    views.textContent = Number(item.views).toLocaleString("id-ID")
      + " penayangan";

    const date = document.createElement("small");
    date.textContent = item.publishedAt
      ? new Date(item.publishedAt).toLocaleDateString("id-ID")
      : "Tanggal tidak tersedia";

    const actions = document.createElement("div");
    actions.className = "video-actions";

    const saveButton = document.createElement("button");
    saveButton.textContent = "♥ Favorit";

    function perbaruiTombolFavorit() {
      const saved = bacaPenyimpanan(STORAGE_FAVORITES)
        .some(v => v.id === item.id);

      saveButton.classList.toggle("saved", saved);
      saveButton.textContent = saved
        ? "♥ Tersimpan"
        : "♡ Favorit";
    }

    perbaruiTombolFavorit();

    saveButton.addEventListener("click", () => {
      toggleFavorit(item);
      perbaruiTombolFavorit();
    });

    const shareButton = document.createElement("button");
    shareButton.textContent = "↗ Bagikan";

    shareButton.addEventListener("click", () => {
      bagikanVideo(item);
    });

    actions.append(saveButton, shareButton);

    const watchButton = document.createElement("button");
    watchButton.className = "video-play";
    watchButton.textContent = "▶ Tonton Video";
    watchButton.addEventListener("click", () => putarVideo(item));

    card.append(
      thumbWrap,
      title,
      channel,
      views,
      date,
      actions,
      watchButton
    );

    list.appendChild(card);
    total++;
  });

  tampilkanPesan(total ? "" : "Video tidak ditemukan.");

  document.getElementById("videoCount").textContent =
    total + " video";
}

/* PEMUTAR */
function putarVideo(item) {
  currentVideo = item;

  playerBox.style.display = "block";

  player.src =
    "https://www.youtube-nocookie.com/embed/" +
    encodeURIComponent(item.id) +
    "?autoplay=1&rel=0";

  document.getElementById("playingTitle").textContent =
    item.title;

  simpanRiwayat(item);

  playerBox.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function tutupPemutar() {
  player.src = "";
  playerBox.style.display = "none";
  currentVideo = null;
}

/* FAVORIT */
function toggleFavorit(item) {
  let favorites = bacaPenyimpanan(STORAGE_FAVORITES);

  const exists = favorites.some(v => v.id === item.id);

  if (exists) {
    favorites = favorites.filter(v => v.id !== item.id);
    tampilkanPesan("Video dihapus dari favorit.");
  } else {
    favorites.unshift(item);
    tampilkanPesan("Video disimpan ke favorit.");
  }

  simpanPenyimpanan(STORAGE_FAVORITES, favorites);
}

/* RIWAYAT */
function simpanRiwayat(item) {
  let history = bacaPenyimpanan(STORAGE_HISTORY);

  history = history.filter(v => v.id !== item.id);
  history.unshift({
    ...item,
    watchedAt: new Date().toISOString()
  });

  history = history.slice(0, 100);

  simpanPenyimpanan(STORAGE_HISTORY, history);
}

/* TAMPILKAN KOLEKSI */
function tampilkanKoleksi(mode) {
  tutupPemutar();

  currentMode = mode;
  list.className = "video-grid";

  const favorites = bacaPenyimpanan(STORAGE_FAVORITES);
  const history = bacaPenyimpanan(STORAGE_HISTORY);

  const data = mode === "favorites" ? favorites : history;

  document.getElementById("sectionTitle").textContent =
    mode === "favorites" ? "Video Favorit" : "Riwayat Tontonan";

  document.querySelectorAll("#categoryTabs button")
    .forEach(b => b.classList.remove("active"));

  if (!data.length) {
    list.innerHTML = `
      <div class="empty-state">
        <strong>${mode === "favorites" ? "Belum Ada Favorit" : "Belum Ada Riwayat"}</strong>
        Video yang kamu simpan akan muncul di sini.
      </div>
    `;
    tampilkanPesan("");
    document.getElementById("videoCount").textContent = "0 video";
    return;
  }

  const videos = data.map(v => ({
    id: v.id,
    snippet: {
      title: v.title,
      channelTitle: v.channel,
      thumbnails: {
        medium: { url: v.thumbnail }
      },
      publishedAt: v.publishedAt
    },
    statistics: {
      viewCount: v.views
    }
  }));

  currentVideos = videos;
  tampilkanVideo(videos);

  document.getElementById("videoCount").textContent =
    data.length + " video";
}

/* BAGIKAN */
async function bagikanVideo(item) {
  const url = "https://www.youtube.com/watch?v=" +
    encodeURIComponent(item.id);

  const shareData = {
    title: item.title,
    text: "Tonton video ini di YouTube",
    url
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(url);
      tampilkanPesan("Tautan video berhasil disalin.");
    } else {
      window.prompt("Salin tautan video:", url);
    }
  } catch (error) {
    if (error.name !== "AbortError") {
      tampilkanPesan("Tidak dapat membagikan video.");
    }
  }
}

/* BERANDA */
function beranda() {
  currentMode = "popular";
  list.className = "video-grid";

  pilihTampilan(document.getElementById("homeButton"));

  const firstTab = document.querySelector(
    '#categoryTabs button[data-mode="popular"]'
  );

  pilihTab(firstTab);

  document.getElementById("sectionTitle").textContent =
    "Video Populer";

  searchInput.value = "";

  tutupPemutar();
  ambilVideo("popular");
}

/* SHORTS */
function shorts() {
  currentMode = "shorts";
  list.className = "video-grid shorts-grid";

  document.getElementById("sectionTitle").textContent =
    "▶ Shorts";

  searchInput.value = "YouTube Shorts Indonesia";

  tutupPemutar();
  ambilVideo("search", "YouTube Shorts Indonesia");
}

/* PENCARIAN */
function cariVideo() {
  const kata = searchInput.value.trim();

  if (!kata) {
    tampilkanPesan("Masukkan kata pencarian.");
    return;
  }

  currentMode = "search";
  list.className = "video-grid";

  document.getElementById("sectionTitle").textContent =
    "Hasil Pencarian";

  document.querySelectorAll("#categoryTabs button")
    .forEach(b => b.classList.remove("active"));

  pilihTampilan(document.getElementById("homeButton"));

  tutupPemutar();
  ambilVideo("search", kata);
}

/* KATEGORI */
function kategori(kata, button) {
  const pencarian = categoryKeywords[kata] || kata;

  currentMode = "search";
  list.className = "video-grid";

  pilihTab(button);
  pilihTampilan(document.getElementById("homeButton"));

  searchInput.value = pencarian;

  document.getElementById("sectionTitle").textContent =
    "Kategori " + kata.charAt(0).toUpperCase() + kata.slice(1);

  tutupPemutar();
  ambilVideo("search", pencarian);
}

/* EVENT */
document.getElementById("searchButton")
  .addEventListener("click", cariVideo);

searchInput.addEventListener("keydown", event => {
  if (event.key === "Enter") cariVideo();
});

document.getElementById("closePlayer")
  .addEventListener("click", tutupPemutar);

document.getElementById("sharePlaying")
  .addEventListener("click", () => {
    if (currentVideo) bagikanVideo(currentVideo);
  });

document.getElementById("homeButton")
  .addEventListener("click", beranda);

document.getElementById("savedButton")
  .addEventListener("click", event => {
    pilihTampilan(event.currentTarget);
    tampilkanKoleksi("favorites");
  });

document.getElementById("historyButton")
  .addEventListener("click", event => {
    pilihTampilan(event.currentTarget);
    tampilkanKoleksi("history");
  });

document.querySelectorAll("#categoryTabs button")
  .forEach(button => {
    button.addEventListener("click", () => {
      const mode = button.dataset.mode;
      const category = button.dataset.category;

      if (mode === "popular") {
        beranda();
      } else if (mode === "shorts") {
        pilihTab(button);
        shorts();
      } else if (category) {
        kategori(category, button);
      }
    });
  });

/* MULAI */
beranda();

</script>

</body>
</html>
