<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A2318">
<title>GIRINATAN MUSIC</title>

<style>
:root {
  --hitam: #050F0A;
  --hijau-gelap: #0A2318;
  --hijau-dalam: #0F3324;
  --hijau: #00C875;
  --hijau-neon: #22E088;
  --emas: #D4AF37;
  --emas-terang: #F5D76E;
  --emas-cerah: #FFE48C;
  --teks: #FFFFFF;
  --teks-redup: #7A9987;
  --panel: rgba(10, 35, 24, 0.7);
  --batas-emas: rgba(212, 175, 55, 0.3);
  --batas-hijau: rgba(0, 200, 117, 0.25);
  --bayangan-emas: 0 0 25px rgba(212, 175, 55, 0.2);
  --bayangan-hijau: 0 0 35px rgba(0, 200, 117, 0.15);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at top, var(--hijau-dalam) 0%, var(--hitam) 60%);
  color: var(--teks);
  font-family: 'Segoe UI', 'Poppins', Arial, sans-serif;
  padding-bottom: 100px;
  overflow-x: hidden;
}

/* Bintang latar berkedip */
@keyframes twinkle {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 1; }
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: 
    radial-gradient(1px 1px at 25px 40px, var(--emas-terang), transparent),
    radial-gradient(1.5px 1.5px at 80px 90px, var(--hijau), transparent),
    radial-gradient(1px 1px at 120px 60px, var(--emas-cerah), transparent),
    radial-gradient(2px 2px at 180px 130px, var(--emas), transparent),
    radial-gradient(1px 1px at 220px 30px, var(--hijau-neon), transparent);
  background-repeat: repeat;
  background-size: 300px 300px;
  opacity: 0.4;
  pointer-events: none;
  z-index: 0;
  animation: twinkle 4s ease-in-out infinite;
}

.container {
  max-width: 430px;
  margin: 0 auto;
  padding: 20px;
  position: relative;
  z-index: 1;
}

/* ===== HEADER ===== */
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0 20px;
}

.back-btn {
  color: var(--emas-terang);
  font-size: 22px;
  text-decoration: none;
}

.queue-badge {
  color: var(--emas-terang);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 1px;
}

/* ===== NOW PLAYING LABEL ===== */
.now-playing-label {
  text-align: center;
  color: var(--emas);
  font-size: 14px;
  letter-spacing: 4px;
  text-transform: uppercase;
  opacity: 0.7;
  margin-bottom: 8px;
}

/* ===== JUDUL LAGU ===== */
.song-title {
  text-align: center;
  font-size: 36px;
  font-weight: 600;
  background: linear-gradient(90deg, var(--emas-cerah), var(--emas-terang), var(--emas));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 2px;
  margin-bottom: 6px;
  text-shadow: 0 0 30px rgba(245, 215, 110, 0.2);
}

.artist-name {
  text-align: center;
  font-size: 18px;
  color: var(--hijau-neon);
  opacity: 0.85;
  margin-bottom: 40px;
}

/* ===== PIRINGAN HITAM ===== */
.vinyl-container {
  display: flex;
  justify-content: center;
  margin-bottom: 40px;
  position: relative;
}

.vinyl-disc {
  width: 260px;
  height: 260px;
  border-radius: 50%;
  position: relative;
  animation: rotate 20s linear infinite;
  animation-play-state: paused;
  box-shadow: 
    0 0 40px rgba(0, 200, 117, 0.2),
    0 0 80px rgba(212, 175, 55, 0.1),
    inset 0 0 60px rgba(0, 0, 0, 0.8);
}

.vinyl-disc.playing {
  animation-play-state: running;
}

.vinyl-disc::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    #000 0%,
    #1a1a1a 20%,
    #000 40%,
    #121212 60%,
    #000 80%,
    #1a1a1a 100%
  );
  box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
}

.vinyl-ring {
  position: absolute;
  top: 20px; left: 20px; right: 20px; bottom: 20px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--hijau-neon), var(--emas-terang));
  box-shadow: 
    0 0 20px rgba(34, 224, 136, 0.4),
    inset 0 0 15px rgba(255, 255, 255, 0.1);
}

.vinyl-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--emas-cerah), var(--hijau));
  box-shadow: 
    0 0 20px rgba(245, 215, 110, 0.5),
    inset 0 0 10px rgba(255, 255, 255, 0.3);
  z-index: 1;
}

.vinyl-sparkle {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 60%);
  animation: sparkle 2s ease-in-out infinite;
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes sparkle {
  0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
}

/* ===== PROGRESS BAR ===== */
.progress-wrapper {
  margin: 0 10px 30px;
}

.progress-bar-container {
  height: 4px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px;
  cursor: pointer;
  position: relative;
}

.progress-bar-fill {
  height: 100%;
  width: 35%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--hijau), var(--emas-terang));
  position: relative;
  transition: width 0.1s linear;
}

.progress-bar-fill::after {
  content: '';
  position: absolute;
  right: 0; top: 50%;
  transform: translate(50%, -50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px var(--hijau-neon);
}

.time-display {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 13px;
  color: var(--emas-terang);
  font-weight: 500;
}

/* ===== KONTROL PEMUTAR ===== */
.controls-wrapper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  margin-bottom: 30px;
}

.control-btn {
  background: transparent;
  border: none;
  color: var(--emas-terang);
  font-size: 20px;
  cursor: pointer;
  opacity: 0.7;
  transition: all 0.2s ease;
}

.control-btn:hover {
  opacity: 1;
  transform: scale(1.1);
}

.play-button-wrapper {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--hijau-neon), var(--hijau));
  border: 2px solid var(--emas-terang);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 
    0 0 20px rgba(0, 200, 117, 0.4),
    inset 0 0 15px rgba(255, 255, 255, 0.15);
  transition: all 0.3s ease;
}

.play-button-wrapper:hover {
  transform: scale(1.08);
  box-shadow: 
    0 0 35px rgba(0, 200, 117, 0.6),
    inset 0 0 20px rgba(255, 255, 255, 0.2);
}

.play-icon {
  font-size: 28px;
  color: var(--hitam);
  margin-left: 4px;
}

.pause-icon {
  display: none;
  font-size: 24px;
  color: var(--hitam);
}

.playing .play-icon { display: none; }
.playing .pause-icon { display: block; }

/* ===== VOLUME ===== */
.volume-wrapper {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 15px;
  margin-bottom: 30px;
}

.volume-icon {
  color: var(--emas-terang);
  font-size: 18px;
}

.volume-bar-container {
  flex: 1;
  height: 4px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px;
  cursor: pointer;
}

.volume-bar-fill {
  height: 100%;
  width: 70%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--emas), var(--emas-terang));
  position: relative;
}

.volume-bar-fill::after {
  content: '';
  position: absolute;
  right: 0; top: 50%;
  transform: translate(50%, -50%);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 6px var(--emas-terang);
}

/* ===== DAFTAR LAGU ===== */
.section-title {
  font-size: 16px;
  font-weight: 600;
  margin: 30px 0 15px;
  color: var(--emas-terang);
  letter-spacing: 1px;
}

.search {
  width: 100%;
  padding: 14px 18px;
  border-radius: 50px;
  border: 1px solid var(--batas-hijau);
  background: var(--panel);
  color: var(--teks);
  font-size: 14px;
  outline: none;
  margin-bottom: 16px;
  transition: all 0.3s ease;
}

.search:focus {
  border-color: var(--emas);
  box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15);
}

.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 20px;
  scrollbar-width: none;
}

.categories::-webkit-scrollbar { display: none; }

.category {
  flex-shrink: 0;
  background: var(--panel);
  color: var(--teks-redup);
  border: 1px solid transparent;
  padding: 10px 16px;
  border-radius: 50px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.category.active {
  background: linear-gradient(135deg, var(--emas-terang), var(--emas));
  color: var(--hitam);
  font-weight: 600;
  box-shadow: var(--bayangan-emas);
}

.music-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--panel);
  border: 1px solid var(--batas-hijau);
  padding: 14px 16px;
  border-radius: 14px;
  margin-bottom: 10px;
  transition: all 0.3s ease;
  backdrop-filter: blur(8px);
}

.music-card:hover {
  border-color: var(--batas-emas);
  transform: translateX(4px);
}

.music-cover {
  width: 52px;
  height: 52px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--hijau), var(--emas));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  box-shadow: 0 0 10px rgba(0, 200, 117, 0.2);
}

.music-info {
  flex: 1;
  min-width: 0;
}

.music-info h3 {
  font-size: 15px;
  font-weight: 500;
  color: var(--teks);
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.music-info p {
  font-size: 12px;
  color: var(--teks-redup);
}

.music-duration {
  font-size: 12px;
  color: var(--emas-terang);
  opacity: 0.6;
}

.card-play-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--hijau-neon), var(--hijau));
  border: none;
  color: var(--hitam);
  font-size: 14px;
  cursor: pointer;
  flex-shrink: 0;
  box-shadow: 0 0 8px rgba(0, 200, 117, 0.3);
}

/* ===== MODE PEMUTAR ===== */
.mode-tabs {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}

.mode-tab {
  flex: 1;
  padding: 12px;
  border-radius: 50px;
  border: 1px solid var(--batas-emas);
  background: transparent;
  color: var(--emas-terang);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.mode-tab.active {
  background: linear-gradient(135deg, var(--emas-terang), var(--emas));
  color: var(--hitam);
  font-weight: 600;
}

.mode-content {
  display: none;
}

.mode-content.active {
  display: block;
}

.shuffle-btn {
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border: 1px solid var(--emas);
  border-radius: 50px;
  background: linear-gradient(135deg, var(--emas-terang), var(--emas));
  color: var(--hitam);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.shuffle-btn:hover {
  transform: translateY(-2px);
  box-shadow: var(--bayangan-emas);
}

.empty {
  text-align: center;
  color: var(--teks-redup);
  padding: 40px 20px;
  font-size: 14px;
}

.notice {
  background: var(--panel);
  border: 1px solid var(--batas-hijau);
  border-radius: 14px;
  padding: 16px;
  color: var(--teks-redup);
  font-size: 13px;
  line-height: 1.6;
  margin-top: 24px;
}

.notice strong {
  color: var(--emas-terang);
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 50;
  display: flex;
  justify-content: space-around;
  background: rgba(5, 15, 10, 0.85);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--batas-emas);
  padding: 12px 5px 20px;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  color: var(--teks-redup);
  text-decoration: none;
  font-size: 10px;
  transition: color 0.25s ease;
}

.nav-item span {
  font-size: 20px;
  margin-bottom: 3px;
}

.nav-item.active {
  color: var(--emas-terang);
}

/* Pemutar bawaan tersembunyi */
#audioPlayer {
  display: none;
}

iframe {
  border-radius: 12px;
  margin-top: 12px;
  border: 1px solid var(--batas-hijau);
}

.hidden { display: none !important; }
</style>
</head>

<body>

<div class="container">

  <!-- Header -->
  <div class="header-top">
    <a href="#" class="back-btn">←</a>
    <span class="queue-badge">#01</span>
    <span style="opacity:0">⚙</span>
  </div>

  <!-- Sekarang Memutar -->
  <p class="now-playing-label" id="nowPlayingLabel">Now Playing</p>
  <h2 class="song-title" id="currentSongTitle">Midnight Melody</h2>
  <p class="artist-name" id="currentArtistName">Luna Strings</p>

  <!-- Piringan Hitam -->
  <div class="vinyl-container">
    <div class="vinyl-disc" id="vinylDisc">
      <div class="vinyl-ring"></div>
      <div class="vinyl-center">
        <div class="vinyl-sparkle"></div>
      </div>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-wrapper">
    <div class="progress-bar-container" id="progressBarContainer">
      <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>
    <div class="time-display">
      <span id="currentTime">1:20</span>
      <span id="totalTime">3:45</span>
    </div>
  </div>

  <!-- Kontrol -->
  <div class="controls-wrapper">
    <button class="control-btn" id="shuffleBtn">🔀</button>
    <button class="control-btn" id="prevBtn">◀◀</button>
    
    <div class="play-button-wrapper" id="playButton">
      <span class="play-icon">▶</span>
      <span class="pause-icon">⏸</span>
    </div>
    
    <button class="control-btn" id="nextBtn">▶▶</button>
    <button class="control-btn" id="repeatBtn">🔁</button>
  </div>

  <!-- Volume -->
  <div class="volume-wrapper">
    <span class="volume-icon">🔊</span>
    <div class="volume-bar-container" id="volumeContainer">
      <div class="volume-bar-fill" id="volumeFill"></div>
    </div>
  </div>

  <!-- Mode Tab -->
  <div class="section-title">Sumber Musik</div>
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="jamendo">🎵 Jamendo</button>
    <button class="mode-tab" data-mode="youtube">▶ YouTube</button>
    <button class="mode-tab" data-mode="spotify">🎧 Spotify</button>
  </div>

  <!-- Mode Jamendo -->
  <div class="mode-content active" id="jamendoMode">
    <input
      type="search"
      class="search"
      id="searchMusic"
      placeholder="🔍 Cari musik atau genre..."
      oninput="searchMusic()"
    >

    <div class="section-title">Genre</div>
    <div class="categories">
      <button class="category active" onclick="filterMusic('semua',this)">Semua</button>
      <button class="category" onclick="filterMusic('pop',this)">Pop</button>
      <button class="category" onclick="filterMusic('dangdut',this)">Dangdut</button>
      <button class="category"
