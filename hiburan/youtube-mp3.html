<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A2318">
<title>GIRINATAN MUSIC</title>

<style>
:root {
  --hitam: #050F0A;
  --hijau-gelap: #0A2318;
  --hijau-dalam: #0F3324;
  --hijau: #00C875;
  --hijau-neon: #22E088;
  --emas: #D4AF37;
  --emas-terang: #F5D76E;
  --emas-cerah: #FFE48C;
  --teks: #FFFFFF;
  --teks-redup: #7A9987;
  --panel: rgba(10, 35, 24, 0.7);
  --batas-emas: rgba(212, 175, 55, 0.3);
  --batas-hijau: rgba(0, 200, 117, 0.25);
  --bayangan-emas: 0 0 25px rgba(212, 175, 55, 0.2);
  --bayangan-hijau: 0 0 35px rgba(0, 200, 117, 0.15);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at top, var(--hijau-dalam) 0%, var(--hitam) 60%);
  color: var(--teks);
  font-family: 'Segoe UI', 'Poppins', Arial, sans-serif;
  padding-bottom: 95px;
  overflow-x: hidden;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 1; }
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: 
    radial-gradient(1px 1px at 25px 40px, var(--emas-terang), transparent),
    radial-gradient(1.5px 1.5px at 80px 90px, var(--hijau), transparent),
    radial-gradient(1px 1px at 120px 60px, var(--emas-cerah), transparent),
    radial-gradient(2px 2px at 180px 130px, var(--emas), transparent),
    radial-gradient(1px 1px at 220px 30px, var(--hijau-neon), transparent);
  background-repeat: repeat;
  background-size: 300px 300px;
  opacity: 0.4;
  pointer-events: none;
  z-index: 0;
  animation: twinkle 4s ease-in-out infinite;
}

.container {
  max-width: 430px;
  margin: 0 auto;
  padding: 20px;
  position: relative;
  z-index: 1;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0 20px;
}

.back-btn {
  color: var(--emas-terang);
  font-size: 22px;
  text-decoration: none;
  cursor: pointer;
}

.queue-badge {
  color: var(--emas-terang);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 1px;
}

.now-playing-label {
  text-align: center;
  color: var(--emas);
  font-size: 14px;
  letter-spacing: 4px;
  text-transform: uppercase;
  opacity: 0.7;
  margin-bottom: 8px;
}

.song-title {
  text-align: center;
  font-size: 28px;
  font-weight: 600;
  background: linear-gradient(90deg, var(--emas-cerah), var(--emas-terang), var(--emas));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 1px;
  margin-bottom: 6px;
}

.artist-name {
  text-align: center;
  font-size: 15px;
  color: var(--hijau-neon);
  opacity: 0.85;
  margin-bottom: 30px;
}

.vinyl-container {
  display: flex;
  justify-content: center;
  margin-bottom: 30px;
  position: relative;
}

.vinyl-disc {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  position: relative;
  animation: rotate 20s linear infinite;
  animation-play-state: paused;
  box-shadow: 
    0 0 40px rgba(0, 200, 117, 0.2),
    0 0 80px rgba(212, 175, 55, 0.1),
    inset 0 0 60px rgba(0, 0, 0, 0.8);
}

.vinyl-disc.playing {
  animation-play-state: running;
}

.vinyl-disc::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    #000 0%, #1a1a1a 20%, #000 40%,
    #121212 60%, #000 80%, #1a1a1a 100%
  );
}

.vinyl-ring {
  position: absolute;
  top: 16px; left: 16px; right: 16px; bottom: 16px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--hijau-neon), var(--emas-terang));
  box-shadow: 0 0 20px rgba(34, 224, 136, 0.4);
}

.vinyl-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--emas-cerah), var(--hijau));
  box-shadow: 0 0 15px rgba(245, 215, 110, 0.5);
  z-index: 1;
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.progress-wrapper {
  margin: 0 10px 25px;
}

.progress-bar-container {
  height: 4px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px;
  cursor: pointer;
}

.progress-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--hijau), var(--emas-terang));
  position: relative;
  transition: width 0.1s linear;
}

.progress-bar-fill::after {
  content: '';
  position: absolute;
  right: 0; top: 50%;
  transform: translate(50%, -50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px var(--hijau-neon);
}

.time-display {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 12px;
  color: var(--emas-terang);
}

.controls-wrapper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  margin-bottom: 25px;
}

.control-btn {
  background: transparent;
  border: none;
  color: var(--emas-terang);
  font-size: 18px;
  cursor: pointer;
  opacity: 0.7;
  transition: all 0.2s ease;
}

.control-btn:hover {
  opacity: 1;
  transform: scale(1.1);
}

.play-button-wrapper {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--hijau-neon), var(--hijau));
  border: 2px solid var(--emas-terang);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(0, 200, 117, 0.4);
  transition: all 0.3s ease;
}

.play-button-wrapper:hover {
  transform: scale(1.08);
  box-shadow: 0 0 35px rgba(0, 200, 117, 0.6);
}

.play-icon { font-size: 22px; color: var(--hitam); margin-left: 3px; }
.pause-icon { display: none; font-size: 18px; color: var(--hitam); }
.playing .play-icon { display: none; }
.playing .pause-icon { display: block; }

.section-title {
  font-size: 15px;
  font-weight: 600;
  margin: 28px 0 12px;
  color: var(--emas-terang);
  letter-spacing: 1px;
}

.search {
  width: 100%;
  padding: 13px 16px;
  border-radius: 50px;
  border: 1px solid var(--batas-hijau);
  background: var(--panel);
  color: var(--teks);
  font-size: 14px;
  outline: none;
  margin-bottom: 16px;
}

.search:focus {
  border-color: var(--emas);
  box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15);
}

.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 16px;
  scrollbar-width: none;
}

.categories::-webkit-scrollbar { display: none; }

.category {
  flex-shrink: 0;
  background: var(--panel);
  color: var(--teks-redup);
  border: 1px solid transparent;
  padding: 8px 14px;
  border-radius: 50px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.category.active {
  background: linear-gradient(135deg, var(--emas-terang), var(--emas));
  color: var(--hitam);
  font-weight: 600;
  box-shadow: var(--bayangan-emas);
}

.music-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--panel);
  border: 1px solid var(--batas-hijau);
  padding: 13px 15px;
  border-radius: 12px;
  margin-bottom: 10px;
  transition: all 0.3s ease;
}

.music-card:hover {
  border-color: var(--batas-emas);
  transform: translateX(3px);
}

.music-icon {
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(0, 200, 117, 0.2), rgba(212, 175, 55, 0.1));
  border-radius: 8px;
  font-size: 20px;
}

.music-info {
  flex: 1;
  min-width: 0;
}

.music-info h3 {
  margin: 0 0 3px;
  font-size: 14px;
  font-weight: 500;
  color: var(--teks);
}

.music-info p {
  margin: 0;
  color: var(--teks-redup);
  font-size: 12px;
}

.play-btn {
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--hijau-neon), var(--hijau));
  color: var(--hitam);
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(0, 200, 117, 0.35);
  transition: all 0.25s ease;
}

.play-btn:hover {
  transform: scale(1.08);
}

.shuffle-btn {
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  border: 1px solid var(--emas);
  border-radius: 50px;
  background: linear-gradient(135deg, var(--emas-terang), var(--emas));
  color: var(--hitam);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.shuffle-btn:hover {
  transform: translateY(-2px);
  box-shadow: var(--bayangan-emas);
}

.mode-tabs {
  display: flex;
  gap: 8px;
  margin: 20px 0;
}

.mode-tab {
  flex: 1;
  padding: 9px;
  border-radius: 50px;
  border: 1px solid var(--batas-emas);
  background: transparent;
  color: var(--emas-terang);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.mode-tab.active {
  background: linear-gradient(135deg, var(--emas-terang), var(--emas));
  color: var(--hitam);
  font-weight: 600;
}

.mode-content { display: none; }
.mode-content.active { display: block; }

.empty {
  text-align: center;
  color: var(--teks-redup);
  padding: 30px 15px;
  font-size: 14px;
}

.notice {
  background: var(--panel);
  border: 1px solid var(--batas-hijau);
  border-radius: 12px;
  padding: 14px;
  color: var(--teks-redup);
  font-size: 12px;
  line-height: 1.6;
  margin-top: 24px;
}

.notice strong {
  color: var(--emas-terang);
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 50;
  display: flex;
  justify-content: space-around;
  background: rgba(5, 15, 10, 0.9);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--batas-emas);
  padding: 10px 5px 15px;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  color: var(--teks-redup);
  text-decoration: none;
  font-size: 10px;
  transition: color 0.25s ease;
}

.nav-item span {
  font-size: 18px;
  margin-bottom: 2px;
}

.nav-item.active {
  color: var(--emas-terang);
}

#audioPlayer { display: none; }
iframe { border-radius: 12px; margin-top: 10px; border: 1px solid var(--batas-hijau); width: 100%; }
</style>
</head>

<body>

<div class="container">

  <!-- Header -->
  <div class="header-top">
    <span class="back-btn" onclick="history.back()">←</span>
    <span class="queue-badge">#01</span>
    <span></span>
  </div>

  <!-- Sekarang Memutar -->
  <p class="now-playing-label">Now Playing</p>
  <h2 class="song-title" id="currentSongTitle">—</h2>
  <p class="artist-name" id="currentArtistName">Pilih lagu untuk mulai mendengarkan</p>

  <!-- Piringan Hitam -->
  <div class="vinyl-container">
    <div class="vinyl-disc" id="vinylDisc">
      <div class="vinyl-ring"></div>
      <div class="vinyl-center"></div>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-wrapper">
    <div class="progress-bar-container" id="progressBarContainer" onclick="seekTo(event)">
      <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>
    <div class="time-display">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>
  </div>

  <!-- Kontrol -->
  <div class="controls-wrapper">
    <button class="control-btn" id="shuffleToggle" title="Acak">🔀</button>
    <button class="control-btn" onclick="skipBack()" title="Mundur 10s">◀◀</button>
    
    <div class="play-button-wrapper" id="playButton" onclick="togglePlay()">
      <span class="play-icon">▶</span>
      <span class="pause-icon">⏸</span>
    </div>
    
    <button class="control-btn" onclick="skipForward()" title="Maju 10s">▶▶</button>
    <button class="control-btn" id="repeatToggle" title="Ulang">🔁</button>
  </div>

  <!-- Mode Tab -->
  <div class="section-title">Sumber Musik</div>
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="jamendo" onclick="switchMode('jamendo', this)">🎵 Jamendo</button>
    <button class="mode-tab" data-mode="youtube" onclick="switchMode('youtube', this)">▶ YouTube</button>
    <button class="mode-tab" data-mode="spotify" onclick="switchMode('spotify', this)">🎧 Spotify</button>
  </div>

  <!-- === JAMENDO MODE === -->
  <div class="mode-content active" id="jamendoMode">
    <input
      type="search"
      class="search"
      id="searchMusic"
      placeholder="🔍 Cari musik atau genre..."
      oninput="searchMusic()"
    >

    <div class="section-title">Jelajahi Genre</div>
    <div class="categories">
      <button class="category active" onclick="filterMusic('semua', this)">Semua</button>
      <button class="category" onclick="filterMusic('pop', this)">Pop</button>
      <button class="category" onclick="filterMusic('rock', this)">Rock</button>
      <button class="category" onclick="filterMusic('electronic', this)">Elektronik</button>
      <button class="category" onclick="filterMusic('ambient', this)">Ambient</button>
      <button class="category" onclick="filterMusic('instrumental', this)">Instrumen</button>
    </div>

    <button class="shuffle-btn" onclick="loadRandomTracks()">
      🔀 Muat Musik Acak
    </button>

    <div class="section-title">Daftar Musik</div>
    <div id="musicList">
      <div class="empty">
        Klik tombol di atas untuk memuat musik...
      </div>
    </div>
  </div>

  <!-- === YOUTUBE MODE === -->
  <div class="mode-content" id="youtubeMode">
    <input
      id="youtubeSearch"
      class="search"
      placeholder="🔍 Masukkan kata kunci lagu..."
    >
    <button class="shuffle-btn" onclick="searchYouTube()">
      🔍 Cari di YouTube
    </button>
    <div id="youtubeResults"></div>
    <div id="youtubePlayer"></div>
  </div>

  <!-- === SPOTIFY MODE === -->
  <div class="mode-content" id="spotifyMode">
    <input
      id="spotifyUrl"
      class="search"
      placeholder="Tempel link lagu/playlist Spotify..."
    >
    <button class="shuffle-btn" onclick="loadSpotify()">
      🎧 Tampilkan di Spotify
    </button>
    <div id="spotifyPlayer"></div>
  </div>

  <!-- Audio Player -->
  <audio id="audioPlayer" ontimeupdate="updateProgress()" onloadedmetadata="updateDuration()" onended="onTrackEnd()">

  <!-- Info -->
  <div class="notice">
    <strong>ℹ️ GIRINATAN MUSIC</strong><br>
    Musik dari Jamendo (Lisensi CC), YouTube & Spotify. Tidak menyimpan file musik.
  </div>

</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <a href="#" class="nav-item active"><span>🎵</span>Musik</a>
  <a href="#" class="nav-item"><span>🔍</span>Cari</a>
  <a href="#" class="nav-item"><span>❤️</span>Favorit</a>
  <a href="#" class="nav-item"><span>⚙️</span>Pengaturan</a>
</div>

<script>
// === VARIABEL GLOBAL ===
let currentTracks = [];
let currentTrackIndex = -1;
let isPlaying = false;
let isRepeat = false;
let isShuffle = false;
let currentMode = 'jamendo';

const AUDIO_PLAYER = document.getElementById('audioPlayer');
const VINYL_DISC = document.getElementById
// === VARIABEL GLOBAL ===
let currentTracks = [];
let currentTrackIndex = -1;
let isPlaying = false;
let isRepeat = false;
let isShuffle = false;
let currentMode = 'jamendo';

const AUDIO_PLAYER = document.getElementById('audioPlayer');
const VINYL_DISC = document.getElementById('vinylDisc');
const PLAY_BUTTON = document.getElementById('playButton');
const CURRENT_SONG_TITLE = document.getElementById('currentSongTitle');
const CURRENT_ARTIST_NAME = document.getElementById('currentArtistName');
const PROGRESS_BAR_FILL = document.getElementById('progressBarFill');
const CURRENT_TIME = document.getElementById('currentTime');
const TOTAL_TIME = document.getElementById('totalTime');
const MUSIC_LIST = document.getElementById('musicList');
const SHUFFLE_TOGGLE = document.getElementById('shuffleToggle');
const REPEAT_TOGGLE = document.getElementById('repeatToggle');

// === FUNGSI UTAMA ===

// Ganti mode (Jamendo / YouTube / Spotify)
function switchMode(mode, tabEl) {
  currentMode = mode;
  
  // Update tab aktif
  document.querySelectorAll('.mode-tab').forEach(tab => tab.classList.remove('active'));
  tabEl.classList.add('active');
  
  // Tampilkan konten yang sesuai
  document.querySelectorAll('.mode-content').forEach(content => content.classList.remove('active'));
  document.getElementById(mode + 'Mode').classList.add('active');
}

// Putar / Jeda
function togglePlay() {
  if (currentTrackIndex === -1 && currentTracks.length > 0) {
    // Jika belum ada lagu yang dipilih, putar lagu pertama
    playTrack(0);
    return;
  }
  
  if (isPlaying) {
    AUDIO_PLAYER.pause();
    isPlaying = false;
    VINYL_DISC.classList.remove('playing');
    PLAY_BUTTON.classList.remove('playing');
  } else {
    AUDIO_PLAYER.play();
    isPlaying = true;
    VINYL_DISC.classList.add('playing');
    PLAY_BUTTON.classList.add('playing');
  }
}

// Putar lagu tertentu
function playTrack(index) {
  if (index < 0 || index >= currentTracks.length) return;
  
  currentTrackIndex = index;
  const track = currentTracks[index];
  
  CURRENT_SONG_TITLE.textContent = track.name || 'Lagu Tidak Diketahui';
  CURRENT_ARTIST_NAME.textContent = track.artist_name || 'Artis Tidak Diketahui';
  
  AUDIO_PLAYER.src = track.audio;
  AUDIO_PLAYER.play();
  isPlaying = true;
  VINYL_DISC.classList.add('playing');
  PLAY_BUTTON.classList.add('playing');
  
  // Update tampilan daftar lagu
  renderMusicList();
}

// Mundur 10 detik
function skipBack() {
  if (AUDIO_PLAYER.src) {
    AUDIO_PLAYER.currentTime = Math.max(0, AUDIO_PLAYER.currentTime - 10);
  }
}

// Maju 10 detik
function skipForward() {
  if (AUDIO_PLAYER.src) {
    AUDIO_PLAYER.currentTime = Math.min(AUDIO_PLAYER.duration, AUDIO_PLAYER.currentTime + 10);
  }
}

// Lagu berikutnya
function nextTrack() {
  if (currentTracks.length === 0) return;
  
  let nextIndex;
  if (isShuffle) {
    nextIndex = Math.floor(Math.random() * currentTracks.length);
  } else {
    nextIndex = (currentTrackIndex + 1) % currentTracks.length;
  }
  playTrack(nextIndex);
}

// Lagu sebelumnya
function prevTrack() {
  if (currentTracks.length === 0) return;
  
  let prevIndex;
  if (isShuffle) {
    prevIndex = Math.floor(Math.random() * currentTracks.length);
  } else {
    prevIndex = (currentTrackIndex - 1 + currentTracks.length) % currentTracks.length;
  }
  playTrack(prevIndex);
}

// Selesai satu lagu
function onTrackEnd() {
  if (isRepeat) {
    AUDIO_PLAYER.currentTime = 0;
    AUDIO_PLAYER.play();
  } else {
    nextTrack();
  }
}

// Update progress bar
function updateProgress() {
  if (AUDIO_PLAYER.duration) {
    const percent = (AUDIO_PLAYER.currentTime / AUDIO_PLAYER.duration) * 100;
    PROGRESS_BAR_FILL.style.width = percent + '%';
    CURRENT_TIME.textContent = formatTime(AUDIO_PLAYER.currentTime);
  }
}

// Update durasi total
function updateDuration() {
  TOTAL_TIME.textContent = formatTime(AUDIO_PLAYER.duration);
}

// Lompat ke posisi tertentu
function seekTo(event) {
  const container = document.getElementById('progressBarContainer');
  const rect = container.getBoundingClientRect();
  const percent = (event.clientX - rect.left) / rect.width;
  
  if (AUDIO_PLAYER.duration) {
    AUDIO_PLAYER.currentTime = percent * AUDIO_PLAYER.duration;
  }
}

// Format waktu (detik -> menit:detik)
function formatTime(seconds) {
  if (!seconds) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

// Toggle ulang
REPEAT_TOGGLE.addEventListener('click', function() {
  isRepeat = !isRepeat;
  this.style.opacity = isRepeat ? '1' : '0.7';
  this.style.textShadow = isRepeat ? '0 0 8px var(--emas-terang)' : 'none';
});

// Toggle acak
SHUFFLE_TOGGLE.addEventListener('click', function() {
  isShuffle = !isShuffle;
  this.style.opacity = isShuffle ? '1' : '0.7';
  this.style.textShadow = isShuffle ? '0 0 8px var(--emas-terang)' : 'none';
});

// === JAMENDO API ===
const JAMENDO_CLIENT_ID = '4d6f07c9'; // Klien ID publik dari Jamendo

// Muat musik acak
async function loadRandomTracks() {
  MUSIC_LIST.innerHTML = '<div class="empty">Sedang memuat musik...</div>';
  
  try {
    const res = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=${JAMENDO_CLIENT_ID}&format=json&limit=15&fuzzytags=instrumental`);
    const data = await res.json();
    currentTracks = data.results || [];
    renderMusicList();
  } catch (err) {
    MUSIC_LIST.innerHTML = '<div class="empty">Gagal memuat musik. Coba lagi.</div>';
    console.error(err);
  }
}

// Cari musik berdasarkan kata kunci
async function searchMusic() {
  const query = document.getElementById('searchMusic').value.trim();
  
  if (query.length < 2) {
    MUSIC_LIST.innerHTML = '<div class="empty">Ketik untuk mencari musik...</div>';
    currentTracks = [];
    return;
  }
  
  MUSIC_LIST.innerHTML = '<div class="empty">Mencari lagu: "' + query + '"...</div>';
  
  try {
    const res = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=${JAMENDO_CLIENT_ID}&format=json&limit=15&namesearch=${encodeURIComponent(query)}`);
    const data = await res.json();
    currentTracks = data.results || [];
    renderMusicList();
  } catch (err) {
    MUSIC_LIST.innerHTML = '<div class="empty">Gagal mencari musik.</div>';
    console.error(err);
  }
}

// Filter berdasarkan genre
async function filterMusic(genre, btnEl) {
  // Update tombol aktif
  document.querySelectorAll('.category').forEach(cat => cat.classList.remove('active'));
  btnEl.classList.add('active');
  
  let url = `https://api.jamendo.com/v3.0/tracks/?client_id=${JAMENDO_CLIENT_ID}&format=json&limit=15`;
  if (genre !== 'semua') url += `&fuzzytags=${genre}`;
  
  MUSIC_LIST.innerHTML = '<div class="empty">Memuat genre: ' + (genre === 'semua' ? 'Semua' : genre) + '...</div>';
  
  try {
    const res = await fetch(url);
    const data = await res.json();
    currentTracks = data.results || [];
    renderMusicList();
  } catch (err) {
    MUSIC_LIST.innerHTML = '<div class="empty">Gagal memuat musik.</div>';
    console.error(err);
  }
}

// Tampilkan daftar lagu ke layar
function renderMusicList() {
  if (currentTracks.length === 0) {
    MUSIC_LIST.innerHTML = '<div class="empty">Tidak ada musik yang tersedia.</div>';
    return;
  }
  
  MUSIC_LIST.innerHTML = currentTracks.map((track, index) => `
    <div class="music-card" style="${index === currentTrackIndex ? 'border-color:var(--emas); background:rgba(212,175,55,0.08);' : ''}">
      <div class="music-icon">🎵</div>
      <div class="music-info">
        <h3>${escapeHtml(track.name)}</h3>
        <p>${escapeHtml(track.artist_name)}</p>
        <span class="music-tag">${formatTime(track.duration)}</span>
      </div>
      <button class="play-btn" onclick="playTrack(${index})">
        ${index === currentTrackIndex && isPlaying ? '⏸' : '▶'}
      </button>
    </div>
  `).join('');
}

// === YOUTUBE MODE ===
function searchYouTube() {
  const keyword = document.getElementById('youtubeSearch').value.trim();
  if (!keyword) {
    alert('Masukkan kata kunci lagu terlebih dahulu');
    return;
  }
  // Buka YouTube di tab baru
  window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(keyword), '_blank');
}

// === SPOTIFY MODE ===
function loadSpotify() {
  const url = document.getElementById('spotifyUrl').value.trim();
  if (!url) {
    alert('Tempel link Spotify terlebih dahulu');
    return;
  }
  if (!url.includes('spotify.com')) {
    alert('Link tidak valid, harap masukkan link Spotify');
    return;
  }
  // Buka link Spotify di tab baru
  window.open(url, '_blank');
}

// Bantuan: Hindari XSS
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Kembali ke halaman sebelumnya
function goBack() {
  history.back();
}
</script>
