
<!DOCTYPE html>

  <style>

body {

}

}
    #formPengajuan h3 {

#formPengajuan label {
  display: block;

  font-size: 14px;
}

#formPengajuan input {
  width: 100%;

  border: 1px solid #343434;

}

.grup-icon {

  background: #202020;

}

.grup-info {
  flex: 1;
}

.grup-info h3 {
  margin: 0 0 6px;
  color: #D6AD48;
}

.grup-info p {
  margin: 0;
  color: #A8ADA8;
  font-size: 13px;
}
    .bottom-nav {
  position: fixed;
  z-index: 100;
  bottom: 0;
  left: 0;
  right: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  background: rgba(8,8,8,.97);
  border-top: 1px solid #665126;
}

.nav-btn {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
  min-height: 58px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: #999;
  font-size: 11px;
  font-weight: bold;
  text-decoration: none;
}

.nav-icon {
  font-size: 21px;
}

.nav-btn.active {
  color: #00C875;
  background: #10251b;
}

body {
  padding-bottom: 90px;
}
</style>
</head>
<body>
  
<header>
  <h2>👥 GIRINATAN KOMUNITAS</h2>
  <p>Ruang berkumpul para manajer dan kreator</p>
</header>
<div id="aksesAdmin" style="display:none; padding:16px;">
  <button onclick="location.href='admin.html'"
    class="btn-ajukan">
    👑 Panel Super Admin
  </button>
</div>
<div class="container">
  <div class="section-title">GRUP AGENSI</div>
</div>
  <button id="tombolAjukan" onclick="ajukanGrup()" class="btn-ajukan">
  + Ajukan Pembuatan Grup Agensi
</button>
  <div id="statusPengajuan" style="display:none; margin-top:15px; padding:15px; background:#17251D; border:1px solid #D6AD48; border-radius:12px;">
  <h3 id="judulStatusPengajuan" style="color:#D6AD48;">
  ⏳ PENGAJUAN DIPROSES
</h3>

<p id="namaStatusPengajuan"></p>

<p id="keteranganStatusPengajuan" style="color:#aaa;">
  Menunggu persetujuan Super Admin.
</p>
</div>
  <div id="formPengajuan" style="display:none; margin-top:20px; background:#151515; padding:16px; border-radius:12px;">

  <h3>Pengajuan Grup Agensi</h3>

  <label>Nama Agensi</label>
  <input id="namaAgensi" type="text" placeholder="Masukkan nama agensi">

  <label>Tautan Pengajuan ke Agensi</label>
  <input id="linkAgensi" type="url" placeholder="Tempel tautan bukti Anda">

  <button onclick="kirimPengajuan()" class="btn-ajukan">
    Kirim Pengajuan
  </button>

</div>
  <div id="daftarGrup" style="margin-top:25px;">
  <div style="text-align:center; padding:30px 15px; background:#151515; border-radius:12px;">
    <div style="font-size:38px;">👥</div>
    <h3 style="color:#D6AD48;">Memuat Grup...</h3>
    <p style="color:#A8ADA8; font-size:13px;">
      Sedang mengambil daftar grup agensi.
    </p>
  </div>
</div>

</div>

</div>
  <h1>Komunitas GIRINATAN</h1>
<script>
function ajukanGrup() {
  const form = document.getElementById("formPengajuan");

  if (form.style.display === "none") {
    form.style.display = "block";
  } else {
    form.style.display = "none";
  }
}
</script>
  <script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import { getAuth }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAoVrrEE0vQQALHFYkog4Xy2mgYIRahzB4",
  authDomain: "girinatan-8d986.firebaseapp.com",
  projectId: "girinatan-8d986",
  storageBucket: "girinatan-8d986.firebasestorage.app",
  messagingSenderId: "762607023765",
  appId: "1:762607023765:web:5d4369ab2e46b244a6cd9c",
  measurementId: "G-799CW1JRQ5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let penggunaLogin = null;
const SUPER_ADMIN_UID = "yUkqaJXZ1ugBizgg18eRyYpwxkf1";
  async function muatDaftarGrup() {
  const daftar = document.getElementById("daftarGrup");

  try {
    const hasil = await getDocs(
      query(
        collection(db, "agency_groups"),
        where("status", "==", "active")
      )
    );

    daftar.innerHTML = "";

    if (hasil.empty) {
      daftar.innerHTML = `
        <div style="text-align:center;padding:30px 15px;background:#151515;border-radius:12px;">
          <div style="font-size:38px;">👥</div>
          <h3 style="color:#D6AD48;">Belum Ada Grup</h3>
          <p style="color:#A8ADA8;font-size:13px;">
            Belum ada grup agensi yang disetujui.
          </p>
        </div>
      `;
      return;
    }

    hasil.forEach((dokumen) => {
      const data = dokumen.data();

      const kartu = document.createElement("div");
      kartu.style.cssText =
        "background:#151515;border:1px solid #806326;border-radius:12px;padding:16px;margin-bottom:12px;";

      const nama = document.createElement("h3");
      nama.style.color = "#D6AD48";
      nama.textContent = "👥 " + (data.agencyName || "Agensi");

      const pemilik = document.createElement("p");
      pemilik.style.color = "#A8ADA8";
      pemilik.style.fontSize = "13px";
      pemilik.textContent = "Pemilik: " + (data.ownerEmail || "-");

      const tombolMasuk = document.createElement("button");
tombolMasuk.textContent = "Masuk Grup";
tombolMasuk.className = "btn-ajukan";
tombolMasuk.style.marginTop = "10px";

tombolMasuk.onclick = () => {
  location.href = "grup.html?id=" + dokumen.id;
};

kartu.append(nama, pemilik, tombolMasuk);
      daftar.appendChild(kartu);
    });

  } catch (error) {
    console.error("Gagal memuat grup:", error);
    daftar.textContent = "Gagal memuat daftar grup. Silakan muat ulang halaman.";
  }
        }
async function cekPengajuan(user) {
  const tombol = document.getElementById("tombolAjukan");
  const statusBox = document.getElementById("statusPengajuan");
  const namaStatus = document.getElementById("namaStatusPengajuan");

  const hasil = await getDocs(
  query(
    collection(db, "agency_group_requests"),
    where("ownerUid", "==", user.uid)
  )
);
const judul = document.getElementById("judulStatusPengajuan");
const keterangan = document.getElementById("keteranganStatusPengajuan");

if (!hasil.empty) {
  const data = hasil.docs
    .map(d => d.data())
    .sort((a, b) => {
      const waktuA = a.createdAt?.seconds || 0;
      const waktuB = b.createdAt?.seconds || 0;
      return waktuB - waktuA;
    })[0];

  statusBox.style.display = "block";
  namaStatus.textContent = "Nama agensi: " + data.agencyName;

  if (data.status === "pending") {
    tombol.style.display = "none";
    judul.textContent = "⏳ PENGAJUAN DIPROSES";
    judul.style.color = "#D6AD48";
    keterangan.textContent = "Menunggu persetujuan Super Admin.";
  } else if (data.status === "rejected") {
    tombol.style.display = "block";
    judul.textContent = "❌ PENGAJUAN DITOLAK";
    judul.style.color = "#F87171";
    keterangan.textContent = "Pengajuan belum disetujui. Periksa kembali bukti pengajuan, lalu ajukan ulang.";
  } else if (data.status === "approved") {
  tombol.style.display = "none";

  const grup = await getDocs(
    query(
      collection(db, "agency_groups"),
      where("ownerUid", "==", user.uid),
      where("status", "==", "active")
    )
  );

  if (!grup.empty) {
    const idGrup = grup.docs[0].id;
    location.replace("grup.html?id=" + idGrup);
    return;
  }

  statusBox.style.display = "block";
  judul.textContent = "GRUP BELUM DITEMUKAN";
  keterangan.textContent = "Hubungi Super Admin.";
}
             } else {
  tombol.style.display = "block";

  document.getElementById("statusPengajuan").style.display = "none";
}
      }
    onAuthStateChanged(auth, (user) => {
  penggunaLogin = user;

  const tombolAdmin = document.getElementById("aksesAdmin");
  const tombol = document.getElementById("tombolAjukan");
  

  if (user && user.uid === SUPER_ADMIN_UID) {
    tombolAdmin.style.display = "block";
  } else {
    tombolAdmin.style.display = "none";
  }
if (user) {
  muatDaftarGrup();

  cekPengajuan(user).catch((error) => {
  
      console.error("Gagal memeriksa pengajuan:", error);
    });
  } else {
    tombol.style.display = "block";
    statusBox.style.display = "none";
  }

  console.log("Status login:", user ? user.uid : "Belum login");
});
    window.kirimPengajuan = async function() {
  const user = auth.currentUser;
  const nama = document.getElementById("namaAgensi").value.trim();
  const link = document.getElementById("linkAgensi").value.trim();

  if (!user) {
    alert("Silakan login terlebih dahulu.");
    return;
  }

  if (!nama || !link) {
    alert("Nama agensi dan tautan wajib diisi.");
    return;
  }

  try {
    const url = new URL(link);

    if (!["http:", "https:"].includes(url.protocol)) {
      throw new Error("Tautan tidak valid");
    }

    await addDoc(collection(db, "agency_group_requests"), {
      agencyName: nama,
      proofUrl: url.href,
      ownerUid: user.uid,
      ownerEmail: user.email || "",
      status: "pending",
      createdAt: serverTimestamp()
    });
await cekPengajuan(user);
    alert("Pengajuan berhasil dikirim dan menunggu persetujuan Super Admin.");
    document.getElementById("namaAgensi").value = "";
    document.getElementById("linkAgensi").value = "";

  } catch (error) {
    console.error(error);
    alert("Pengajuan gagal dikirim. Periksa koneksi dan aturan keamanan Firebase.");
  }
};
console.log("Firebase Komunitas terhubung");
</script>
