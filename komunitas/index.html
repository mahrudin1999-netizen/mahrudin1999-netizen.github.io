<header>

  <p>Ruang berkumpul para manajer dan kreator</p>

<div id="aksesAdmin" style="display:none; padding:16px;">

    class="btn-ajukan">

</div>
<div class="container">

</div>
  <button onclick="ajukanGrup()" class="btn-ajukan">
  + Ajukan Pembuatan Grup Agensi
</button>
  <div id="formPengajuan" style="display:none; margin-top:20px; background:#151515; padding:16px; border-radius:12px;">

  <h3>Pengajuan Grup Agensi</h3>

  <label>Nama Agensi</label>
  <input id="namaAgensi" type="text" placeholder="Masukkan nama agensi">

  <label>Tautan Pengajuan ke Agensi</label>

  <button onclick="kirimPengajuan()" class="btn-ajukan">

</div>
  <div id="daftarGrup" style="margin-top:25px;">

    <div style="font-size:38px;">👥</div>
    <h3 style="color:#D6AD48;">Belum Ada Grup</h3>
    <p style="color:#A8ADA8; font-size:13px;">
      Grup agensi yang disetujui Super Admin akan muncul di sini.
    </p>
  </div>

</div>

</div>
  <h1>Komunitas GIRINATAN</h1>
<script>
function ajukanGrup() {
  const form = document.getElementById("formPengajuan");

  if (form.style.display === "none") {
    form.style.display = "block";
  } else {
    form.style.display = "none";
  }
}
</script>
  <script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import { getAuth }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAoVrrEE0vQQALHFYkog4Xy2mgYIRahzB4",
  authDomain: "girinatan-8d986.firebaseapp.com",
  projectId: "girinatan-8d986",
  storageBucket: "girinatan-8d986.firebasestorage.app",
  messagingSenderId: "762607023765",
  appId: "1:762607023765:web:5d4369ab2e46b244a6cd9c",
  measurementId: "G-799CW1JRQ5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let penggunaLogin = null;
const SUPER_ADMIN_UID = "yUkqaJXZ1ugBizgg18eRyYpwxkf1";

onAuthStateChanged(auth, (user) => {
  penggunaLogin = user;

  const tombolAdmin = document.getElementById("aksesAdmin");

  if (user && user.uid === SUPER_ADMIN_UID) {
    tombolAdmin.style.display = "block";
  } else {
    tombolAdmin.style.display = "none";
  }

  console.log("Status login:", user ? user.uid : "Belum login");
});

    window.kirimPengajuan = async function() {
  const user = auth.currentUser;
  const nama = document.getElementById("namaAgensi").value.trim();
  const link = document.getElementById("linkAgensi").value.trim();

  if (!user) {
    alert("Silakan login terlebih dahulu.");
    return;
  }

  if (!nama || !link) {
    alert("Nama agensi dan tautan wajib diisi.");
    return;
  }

  try {
    const url = new URL(link);

    if (!["http:", "https:"].includes(url.protocol)) {
      throw new Error("Tautan tidak valid");
    }

    await addDoc(collection(db, "agency_group_requests"), {
      agencyName: nama,
      proofUrl: url.href,
      ownerUid: user.uid,
      ownerEmail: user.email || "",
      status: "pending",
      createdAt: serverTimestamp()
    });

    alert("Pengajuan berhasil dikirim dan menunggu persetujuan Super Admin.");
    document.getElementById("namaAgensi").value = "";
    document.getElementById("linkAgensi").value = "";

  } catch (error) {
    console.error(error);
    alert("Pengajuan gagal dikirim. Periksa koneksi dan aturan keamanan Firebase.");
  }
};
console.log("Firebase Komunitas terhubung");
</script>
